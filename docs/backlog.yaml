# Roadmap items mirrored to GitHub issues by scripts/sync_backlog_issues.py.
#
# key:    stable id; written into the issue body as <!-- backlog: key --> so reruns never file duplicates
# kind:   check (verify something already built) | deferred (part of a built phase) | feature (not scheduled)
# phase:  optional; the phase an item is planned for
#
# The script only creates missing issues. It never edits or closes existing ones.

items:
  - key: gpu-guard-real-game
    kind: check
    title: "GPU guard: verify with a real game, Big Picture and a Plex hardware transcode"
    body: |
      Phase 5 was tested with a fake game executable only. Still to verify live:
      - a real game launched from a Steam/Epic/GOG/Xbox library
      - the `Steam Big Picture Mode` window title (e.g. started from Moonlight)
      - a real Plex hardware video transcode

      Check: start a task, launch the game, confirm the pause event and the Actions → GPU card, quit, and confirm the queue resumes about 3 minutes later.

  - key: mac-lid-closed-retest
    kind: check
    title: "MacBook runner: retest the wait path with the Mac actually asleep"
    body: |
      In the Phase 4 lid-closed test the runner kept polling, so the Mac never slept (probably clamshell mode or a sleep assertion) and the `waiting_target` path never ran.

      Retest with no external display, sleep via Apple menu → Sleep before starting the task, and run `pmset -g assertions` if it still stays awake.

  - key: merge-conflict-ui
    kind: deferred
    title: "Review card: help with merge conflicts"
    body: |
      When a session branch no longer merges cleanly, the only option today is to ask the agent to merge `origin/<base>` itself. Add conflict handling to the Review card (at least show the conflicting files and offer "ask the agent to resolve").

  - key: private-url-push-test
    kind: check
    title: "Test pushing a session branch from a private URL project"
    body: |
      Review → push uses the host's git credentials. It has only been exercised with local and public repos; verify with a private repository URL.

  - key: runner-generate-image
    kind: deferred
    title: "generate_image for runner (MacBook) sessions"
    body: |
      `generate_image` only works in tower sessions, because the runner protocol has no binary file transfer. Add a transfer path so generated images land in the Mac workspace.

  - key: endpoint-from-mac
    kind: check
    title: "Inference endpoint: test from the MacBook"
    body: |
      The OpenAI/Anthropic-compatible endpoint was only tested from the tower. Try a coding tool on the Mac against it over the tailnet (streaming and tool calls).

  - key: gpt-oss-secondary
    kind: feature
    title: "gpt-oss-20b secondary local model — not planned"
    body: |
      Closed as not planned 2026-09-17. Qwen already handles compaction, hosted Phase 8 backends cover cheap
      subtasks, and #18 specifies a hosted smart-approval reviewer without a second local model. Qwen and
      gpt-oss-20b cannot remain loaded together in 32 GB RAM / 16 GB VRAM, so a swap adds lifecycle latency and
      scheduler complexity without a current product requirement. A materially smaller future helper with a new,
      concrete unmet job should get a new benchmark-first issue rather than reopening this proposal.

  - key: flag-unsupported-quotes
    kind: deferred
    phase: 8
    title: "Flag quotes in answers that don't appear in fetched text"
    body: |
      In the Phase 7e web suite, Qwen sometimes gave a correct answer with a made-up quote attributed to a page it fetched. The benchmark suite now fails such answers, but live sessions don't flag them. Check quoted passages in final answers against the text fetched during the session and mark unsupported ones.

  - key: github-page-extraction
    kind: deferred
    phase: 8
    title: "web_fetch: better extraction of GitHub repository pages"
    body: |
      Trafilatura extracts GitHub repository pages poorly (navigation noise, README cut short). Special-case github.com URLs, e.g. fetch the raw README and repository metadata.

  - key: embeddings-route
    kind: feature
    title: "Inference endpoint: /v1/embeddings"
    body: |
      The endpoint has chat, messages and responses routes but no embeddings route.

  - key: endpoint-load-test
    kind: check
    title: "Inference endpoint: load-test the fairness rule and the 429 limit"
    body: |
      The GPU-sharing rule (endpoint requests wait only for the agent call in flight; an agent call waiting 90 s gets priority) and the 429 above 4 waiting requests are covered by unit tests only. Verify under real concurrent load.

  - key: images-extras
    kind: feature
    title: "Images: backups, upscaling and inpainting"
    body: |
      Superseded 2026-09-17 by the focused image-backup-archive, image-upscale-realesrgan, and
      image-inpainting-edit issues. This umbrella was closed to avoid duplicate work.

  - key: image-backup-archive
    kind: feature
    title: "Images: archive generated PNGs without duplicating nightly snapshots"
    body: |
      Archive each successful PNG atomically under the configured backup root, separate from dated database
      snapshots so a growing gallery is not copied 14 times. Store a metadata sidecar and verify size/SHA-256.
      Nightly/on-demand backup reconciles missing rows idempotently; source errors warn without invalidating the
      SQLite backup. Default image retention is indefinite and archive deletion requires an explicit owner preview
      and action. Surface archive health, bytes, missing/error counts, free-space warnings, and metrics. Preserve
      module and owner/guest boundaries; never expose backup paths to guests or apps.

  - key: image-upscale-realesrgan
    kind: feature
    title: "Images: opt-in Real-ESRGAN 2x and 4x upscaling"
    body: |
      Add explicit 2x/4x upscaling with upstream BSD-3-Clause RealESRGAN_x2plus/x4plus. Default remains none;
      preserve the original and store a linked derived artifact. Support gallery actions and an optional image API/
      generate_image field. Use the existing GPU queue/hold/batching, tiled inference, pinned hashes, and a safe
      pixel cap. Keep the component optional with doctor/install guidance; omit face enhancement and anime models.

  - key: image-inpainting-edit
    kind: feature
    title: "Images: masked inpainting and photo editing with Qwen-Image-Edit"
    body: |
      Add an optional owner-facing masked edit workflow using the official Apache-2.0 Qwen-Image-Edit family,
      pinned by revision/hash. Start from a gallery image or bounded PNG/JPEG/WebP upload; normalize and strip
      metadata. Provide a mobile-safe draw/erase mask editor (white edits, black preserves), require a prompt, and
      save a linked result without overwriting its source. Reuse the image queue/GPU guard and preserve private
      source/mask data. Missing large model assets must not break text-to-image; require a real 16 GB GPU exit test.

  - key: images-more-models
    kind: feature
    title: "Images: add opt-in Qwen-Image-2512 Lightning 4-step quality mode"
    body: |
      Add the Apache-2.0 lightx2v Qwen-Image-2512 Lightning 4-step LoRA as a distinct `quality-fast` mode.
      Reuse the installed Qwen FP8 base, encoder and VAE; pin the LoRA revision/hash and transcribe ComfyUI's
      official 4-step graph. Do not change the existing Z-Image `fast` default or 50-step `quality` workflow.
      Expose capability/mode metadata consistently and disable only `quality-fast` when the optional LoRA is absent.
      Require graph/backward-compatibility tests plus a same-seed ten-prompt tower comparison with time/RAM/VRAM
      measurements and a visual speed/quality check before closing.

  - key: image-flux2-klein
    kind: feature
    title: "Images: FLUX.2 klein 9B evaluation — no-go"
    body: |
      Closed as not planned 2026-09-17. The official 9B FP8 checkpoint is gated, licensed for non-commercial /
      non-production use, and lists about 29 GB VRAM, so it is a poor fit for a distributable harness targeting
      the 16 GB tower. No weights were downloaded and no gated-token flow was built. The public Apache-2.0 4B
      replacement is tracked separately.

  - key: image-flux2-klein-4b
    kind: feature
    title: "Images: add an optional FLUX.2 klein 4B fast workflow"
    body: |
      Add a distinct optional `flux-fast` text-to-image mode using the public Apache-2.0 distilled 4B FP8
      checkpoint and official four-step ComfyUI graph. Keep Z-Image as the `fast` default and do not change
      `quality`. Pin revisions/hashes and a compatible stable ComfyUI build; stage and regression-test that build
      with rollback before promotion. Reuse the existing `qwen_3_4b.safetensors` encoder only on exact hash
      identity. Provide explicit atomic install/status/remove lifecycle, availability metadata, provenance, doctor
      output, and shared-asset-safe cleanup. Require non-networked tests plus an owner-approved 16 GB tower
      comparison proving headroom, useful visual value, warmed performance, and no regression to existing modes.

  - key: installer-clean-machine
    kind: check
    title: "Installer: test on a clean machine, including the model download and a 12 GB GPU"
    body: |
      `install/install.ps1` was tested on a machine that already had a model server. Untested: a clean Windows machine, the llama.cpp/model download plus the `run-server.ps1` supervisor, and 12 GB GPUs.

  - key: installer-other-platforms
    kind: feature
    title: "Installer: Linux and macOS"
    body: |
      The distributable daemon is Windows + NVIDIA only. Add Linux (NVIDIA) and macOS (Apple Silicon) installs.

  - key: mac-client-package
    kind: feature
    title: "Mac client package: harness CLI, runner installer and pairing code"
    body: |
      Today the runner is deployed from the tower over SSH, and the CLI/SDK need a clone plus `httpx`. One installable piece on the Mac:
      - install script: venv under `~/.agent-harness`, a `harness` command on PATH, runner + launchd agent install/update
      - pairing with a one-time code from Settings instead of SSH and token copying
      - `harness new/list/watch/approve`, `harness projects add ~/Projects/<repo>`, `harness runner status/restart/logs`
      - same sandbox, repo roots and approval flow

  - key: agent-written-skills
    kind: feature
    title: "Agent-written skills with background review"
    body: |
      Add instruction-only skill proposals: one `SKILL.md`, a manifest, and bounded Markdown references—no scripts,
      binaries, packages, symlinks, remote includes, or new tool/policy authority. Owner sessions may create staged,
      content-addressed proposals; apps, guests, jobs, and Chat cannot. Deterministic validation runs in a fresh
      no-network/read-only sandbox, followed by advisory model review only when local GPU work is truly idle (or by
      explicit owner action on hosted-only installs).

      Installation is an explicit owner approval bound to the exact validated hash and enforced by the skill store.
      Install atomically with version history, disable/rollback/uninstall, and default new skills off. V1 activation
      is manual on New task or a deterministic project allowlist; freeze exact enabled versions into new sessions.
      Skills never modify approval rules, permissions, tools, credentials, or running sessions. Executable skills,
      semantic auto-selection, marketplace publishing, and autonomous install/update are future issues.

  - key: smart-approvals
    kind: feature
    title: "Smart approvals: rate commands with an auxiliary model"
    body: |
      Use an owner-configured small hosted API model after the deterministic policy returns a specifically tagged,
      smart-eligible `ASK`. `ALLOW`/`DENY`, memory/Remote Control, destructive or networked commands, external
      publication, credentials, host/admin actions, unknown tools, and ambiguous parsing remain human-only.
      Static eligibility must establish local reversible workspace work before the reviewer runs. The model may
      auto-approve only a strict high-confidence `approve`; every other result/error fails closed to one durable
      human approval. It never auto-denies.

      Keep credentials in opaque owner-managed secret files, use provider-only egress, send only normalized/redacted
      tool data, require structured output, and persist sanitized audit/usage metrics. Default off; after setup default
      to shadow mode and require the owner to enable auto explicitly. No decision cache. Validate with adversarial
      injection/parser tests, at least 100 shadow cases with zero unsafe auto-approval candidates, and a live exit.
      This is independent of parked #7: no second local model or GPU swap.

  - key: remote-control-launch
    kind: feature
    phase: 8
    title: "Launch native Claude Code Remote Control sessions on demand"
    body: |
      Start a detached, unmodified `claude` process with Remote Control in a chosen project directory, so it can be paired from the Claude app within seconds. It rides on Anthropic's own pairing rather than the harness session model, so it needs its own registry: list, stop, and clean up orphaned processes.

  - key: subscription-backends
    kind: feature
    phase: 8
    title: "Claude Code, Codex and Cursor Agent CLIs as session backends"
    body: |
      Run the unmodified `claude` / `codex` / Cursor `agent` CLI inside the session sandbox under the user's own subscription login, as an alternative to local models.
      - Cursor: `agent -p --output-format stream-json`; login via `agent login` in the container, or a Cursor user API key (`CURSOR_API_KEY`), which Cursor documents for automation and CI. Without `--force`, print mode only proposes changes, so check how approvals can be bridged.
      - login happens inside a backend container through the provider's own flow; the daemon never reads or stores tokens
      - CLI permission prompts become ordinary harness approvals, so any client (app API, web app, ntfy) can decide them
      - the daemon is the only thing that talks to the CLI; apps send any agent context to the daemon, which sets up the session
      - each user signs in on their own machine; the app API never routes other people's apps or users through one person's subscription
      - surface rate limits through the app API and web app, with a credit warning and running tally for programmatic usage
      - configurable API keys (from the app builder or the user) as a fallback when limits are hit, or as the default
      - the CLI is never modified, and programmatic use is never disguised as interactive use
      - serve a short usage notice per backend from `GET /api/v1` (terms, billing status, API-key option) so apps can show users current wording; the long form is in docs/app-api.md

  - key: colibri-big-brain
    kind: feature
    title: "Big-brain tool: queue questions for a very large MoE model streamed from SSD"
    body: |
      Blocked on the real-hardware Colibri benchmark in #90. Build no product integration unless that benchmark passes its correctness, throughput, stability, memory, disk, and thermal gates and the owner records a go decision. If viable, return here to settle model, job contract, cancellation, retention, privacy, GPU-hold, and scheduling behavior before implementation.

  - key: colibri-hardware-benchmark
    kind: check
    title: "Benchmark Colibri expert streaming on the tower before building the overnight tool"
    body: |
      Pin and benchmark upstream Colibri on the tower before deciding whether #21 is viable. Phase A may build Colibri and run correctness plus synthetic/tiny/medium benchmarks, but must stop for an explicit owner checkpoint before downloading the roughly 372 GB GLM-5.2 int4 checkpoint. If authorized, Phase B runs 256- and 1024-token real-model trials plus a two-hour soak under the normal GPU hold, records reproducible sanitized measurements, and applies the issue's go/no-go thresholds. This issue is benchmark-only: do not add harness integration.

  - key: session-list-machine-filter
    kind: feature
    title: "Session list: filter by machine"
    body: |
      New task already has a Tower/MacBook switch; the session list doesn't.

  - key: decouple-control-center
    kind: feature
    title: "Extract the Control Center PWA as a first-party daemon client"
    body: |
      The bundled phone PWA has become the first application that consumes the daemon. Make that boundary explicit so
      the daemon can be distributed as a UI-independent local agent service and the Control Center can evolve like any
      other client.

      Current coupling:
      - FastAPI serves `harness/web` directly.
      - The PWA uses relative URLs and same-origin `EventSource` connections.
      - It has no configurable daemon address or bearer-token support.
      - It calls the unversioned operator endpoints rather than dogfooding `/api/v1`.

      Plan:
      1. Give the PWA a configurable daemon base URL and authenticated request/stream client.
      2. Migrate ordinary session/context/event operations to `/api/v1`.
      3. Consume owner-only operations through the planned `/api/admin/v1` surface.
      4. Move the static bundle into its own package or repository.
      5. Retain bundled static serving only as an optional compatibility mode.

      A same-origin extraction is about 1–2 days. A genuinely independent authenticated browser client is expected to
      take about 3–5 days, excluding the owner API and pairing work tracked separately.

  - key: ui-component-naming
    kind: feature
    title: "Adopt explicit names for Agent Harness UI and client components"
    body: |
      Retire ambiguous “Control Center” wording. Canonical names are Agent Harness (product), Agent Harness Server
      (daemon/API), Agent Harness Web (browser/PWA), Agent Harness CLI (`harness`), Agent Harness Runner (remote
      worker), Agent Harness SDK, Agent Harness App (third-party integration), and Agent Harness for Mac (CLI + Mac
      Runner distribution). Technical code/logs may still say daemon; Claude Remote Control and Apple's Control
      Center keep their upstream names.

      Update PWA metadata (full name Agent Harness Web, short label Harness), active UI copy, README/docs, setup,
      connection/account wording, and open-roadmap language. Make `docs/web.md` canonical while leaving the old
      `docs/control-center.md` path as a compatibility pointer. Keep APIs, modules, routes, storage keys, service
      names, credentials, and filesystem paths stable; legacy `control-center` owner tokens remain valid. Land
      before or with #84. The full compatibility and acceptance contract is on the GitHub issue.

  - key: owner-admin-api
    kind: feature
    title: "Add a versioned owner-only API for Control Center operations"
    body: |
      Keep the least-privilege application API separate from machine-owner powers. Add `/api/admin/v1` for the
      operations the Control Center needs but ordinary apps should not receive.

      Candidate owner operations include:
      - global session/search access and session review/push
      - projects, templates and scheduled jobs
      - app/token management
      - maintenance, cleanup and backup
      - GPU/model controls and model warmup
      - runner status, memory status and notifications
      - native Remote Control workspace trust

      Preserve `/api/v1` as the stable app-facing contract. Define an explicit owner credential/scope, version the
      schemas, migrate the PWA, and add authorization tests proving app tokens cannot reach this surface.

  - key: browser-pairing-cors
    kind: feature
    title: "Browser pairing, CORS allowlists and authenticated SSE"
    body: |
      A separately hosted Control Center or browser app cannot use today's implicit same-origin/Tailscale trust model.
      Design a browser-safe connection flow without weakening the daemon's current cross-site request protection.

      Plan:
      - pair through a short-lived, one-time bootstrap code approved by the owner
      - issue a revocable scoped client credential; never put provider credentials in the browser
      - store explicit allowed origins per app/client and emit narrow CORS headers
      - support authenticated resumable SSE (native `EventSource` cannot set an Authorization header, so use fetch
        streaming, an HttpOnly-cookie exchange, or a short-lived stream ticket)
      - cover origin spoofing, token leakage/revocation, reconnect after iOS suspension and CSRF in tests

      This is the main security-sensitive part of decoupling the webapp from the daemon.

  - key: daemon-lite-profile
    kind: feature
    title: "Add a stripped-down daemon service profile"
    body: |
      Provide an install/configuration profile focused on the reusable app service: applications inject context and
      tools, select one of the user's configured providers, stream the session and receive the answer.

      The profile should require only sessions, provider adapters, approvals, events, scoped tokens, storage and
      capability discovery. Local inference, homelab tools, memory-library integration, image generation, scheduled
      jobs, GPU guard, Mac runner and Remote Control should be optional modules selected during setup.

      Requirements:
      - start successfully with hosted providers and no local model configured
      - report enabled capabilities through the API
      - avoid initializing disabled integrations or requiring their dependencies/secrets
      - provide an upgrade path from the current full Windows configuration
      - document the minimum Docker/provider-login requirements and threat boundary

  - key: sdk-contract
    kind: feature
    title: "Stabilize the app SDK and OpenAPI contract across every provider"
    body: |
      Turn the existing one-file Python client and FastAPI schema into the supported integration surface for new apps.

      Cover the complete app lifecycle:
      - connect/pair and capability discovery
      - create a local, Claude, Codex or Cursor session
      - inject initial and incremental context
      - register tools and return tool results
      - stream/reconnect events, surface approvals and cancel
      - expose usage, limits, billing notices, errors and the final answer consistently

      Add provider-contract tests that run the same scripted scenario through all backend adapters. Document event
      ordering, replay guarantees, additive versioning and normalized provider failures. Generate or validate SDK
      types from OpenAPI so the docs, client and server cannot silently drift.

  - key: marketplace-review
    kind: feature
    title: "Design the v1 curated app catalog, threat model, and review process"
    body: |
      Design-only issue on the merged app/API stack. Specify a curated discovery and review index, not a package
      manager, artifact host, payment system, or execution service. Produce the architecture/lifecycle document,
      threat model, strict versioned manifest schema, and ordinary/elevated example manifests. Cover immutable
      versions and evidence, publisher/provenance data, every app scope's risk and disclosure, data flows, static and
      human review, sandbox boundaries for future dynamic analysis, updates/re-consent, abuse/appeal, revocation, and
      catalog/signing-key compromise. Pairing remains an explicit owner action; the catalog never handles Server or
      provider credentials and cannot technically enforce external commercial behavior.

      Include a dated official-source policy matrix for every hosted backend. Preserve owner-managed API-key
      automation, treat subscription-authenticated marketplace use as provider-specific/revocable, and never expose
      agent execution to an untrusted/public environment. Split storage/signing, review automation, Agent Harness Web
      discovery/consent, and Agent Harness Server warning/revocation into later implementation issues; build none of them here.

  - key: marketplace-catalog-storage
    kind: feature
    title: "Implement signed catalog storage and key management"
    body: |
      Follow-up to #28. Build the append-only catalog index specified in docs/marketplace-design.md: immutable
      per-version records, detached signatures over catalog_record_sha256, advisory flags, and audit retention.
      Store links and hashes, not artifacts or credentials. Include catalog signing-key rotation without silent
      owner uninstall or token revocation.

      **Readiness (2026-09-21): needs-refinement.** The design (`docs/marketplace-design.md` §4, §6.4, §8, §10, §12) fixes
      the objects, the signed bytes, the advisory levels and retention, but not where the catalog runs or how it is
      signed, and there is no code or publisher for it yet. Decide first; this issue gates #162-#164.

      Open decisions (recommended default first):
      1. **Who operates it and where it lives.** Default: no hosted service yet. A static index of JSON records in a
         dedicated git repo (audit log = git history, append-only by convention and by signed snapshots), published
         as release assets or static hosting. A service is a later step if a second-party publisher appears.
         Confirm whether a catalog is wanted before any third-party publisher exists (the design says the
         provider-policy review must be repeated before a public launch).
      2. **Signature scheme and key custody.** Default: Ed25519 detached signatures over `catalog_record_sha256`,
         an offline root key that signs a rotatable signing-key set, and a pinned key-set file format that clients
         verify. Pick the library and the format; the rotation snapshot and out-of-band revocation location in
         section 12 ("exact hosting is an implementation issue") must be settled here.
      3. **Advisory feed contract.** One signed snapshot versus per-record files, its URL layout, size and freshness
         fields. #163 and #164 build against this, so it must be written down as part of this issue.
      4. **Publisher intake in v1.** Domain-proof and `ahpub.<slug>.*` namespace review (section 4.2) manual by the
         owner, or tooling now? Default: manual, with the checks documented.
      5. **Code placement.** This repo (public) or a separate catalog repo. The catalog never calls a daemon (section 4.5).

      Acceptance once decided: a verifier and an offline signer with tests for tamper detection, key rotation (a
      record whose bytes do not match its stored hash is never re-signed, section 12), immutability of approved
      versions, and advisories appended without rewriting a version record.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: marketplace-review-automation
    kind: feature
    title: "Automate catalog submission checks and optional review sandbox"
    body: |
      Follow-up to #28. Implement Stage A deterministic checks (schema, identifiers, URLs, license, hashes,
      provenance, SBOM, secret scan, dependency confusion, permission-diff) and evidence packaging for Stage B.
      If Stage C is added, run it only in a disposable sandbox with synthetic credentials and data, no host mounts,
      and no network except the recorded allowlist. Do not execute untrusted submissions against a real daemon.

      **Readiness (2026-09-21): needs-refinement.** Stage A (section 6.1 of the design) is well specified, but several
      checks need the catalog's stored state (version reuse, "publisher owns the id", permission-diff against the
      previous version), which #161 has not defined, and the issue mixes Stage A with an optional Stage C sandbox.

      Open decisions (recommended default first):
      1. **Split Stage C out.** Default: this issue is Stage A plus Stage B evidence packaging only; Stage C (the
         disposable sandbox) becomes its own later issue, since it is a separate security-sensitive runner.
      2. **Offline first.** Default: an offline `check` command that takes a submitted manifest (and optionally the
         previous version's manifest as a file for the permission diff) and needs no catalog store. Checks that need
         the store (version reuse, publisher ownership) attach once #161 lands.
      3. **Typosquat list.** Where the "well-known product names" list comes from and who maintains it.
      4. **Dependency confusion.** Which registries are queried and whether the checker may reach the network. Default:
         no network in the check itself; an unchecked result is reported as `unchecked`, never as a pass.
      5. **SPDX license list.** Vendored at a pinned version.
      6. **Artifact download limits.** Size cap, timeout, redirect rule (section 6.1 item 3), a scratch directory that
         is always deleted, and never any download into a catalog store.
      7. **Evidence format** for Stage B, aligned with the Stage D review object in section 6.4.

      Acceptance once decided: tests per Stage A check (including each secret-scan token prefix in section 6.1 item 7),
      secret-scan failures cannot be overridden, and no untrusted submission is executed.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: marketplace-web-discovery
    kind: feature
    title: "Agent Harness Web catalog discovery and consent UI"
    body: |
      Follow-up to #28. Add discovery of signed catalog listings and conspicuous owner-facing consent copy for
      every requested scope, origin, and hosted-provider mode. Catalog presence grants nothing. Pairing stays an
      explicit daemon action; the Web UI may deep-link to Settings but must not mint, transport, or store ha-/ho-
      tokens or provider credentials.

      **Readiness (2026-09-21): blocked and needs-refinement.** Blocked by #161: there is no catalog to discover and
      no feed or key-set contract yet. The consent content is already specified (`docs/marketplace-design.md` section
      5.2 scope table, section 9 re-consent, section 14 disclosures).

      Open decisions (recommended default first):
      1. **Who verifies signatures.** Default: the daemon fetches and verifies the signed listings and exposes them on
         an owner-only endpoint; the Web client only renders them. Keeps the catalog URL and pinned keys out of the
         browser and matches the rule that the Web UI never mints, transports or stores `ha-`/`ho-` tokens.
      2. **Catalog URL and key set.** Owner-managed installer/file configuration, not a Web setting (same pattern as
         other owner-only settings).
      3. **Where it lives.** A new Agent Harness Web page under Settings, or its own tab.
      4. **Stale or unreachable catalog.** Show the last verified listings with their age; never fail open into
         unverified data.

      Acceptance once decided: every requested scope, origin and hosted-provider mode has consent copy; "catalog
      presence grants nothing" is visible; the only path to pairing is a deep link to daemon Settings.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: marketplace-daemon-revocation-hooks
    kind: feature
    title: "Daemon warning and revocation hooks for catalog advisories"
    body: |
      Follow-up to #28. Teach the daemon to fetch a signed advisory feed and, when an optional catalog_app_id is
      present on a key or pairing request: show warnings, block new pairing, and recommend token revocation.
      Catalog decisions must not silently uninstall software, delete owner data, or revoke tokens without an
      explicit owner action.

      **Readiness (2026-09-21): blocked and needs-refinement.** Blocked by #161 for the signed advisory feed and
      key-set format. The advisory semantics are specified (`docs/marketplace-design.md` sections 4.5, 8 and 16).

      Open decisions (recommended default first):
      1. **Two parts, one dependency.** Part A, an optional `catalog_app_id` on key and pairing-code creation
         (additive within API v1, so the OpenAPI, SDK and `docs/compatibility.md` move together; never inside a token
         secret, section 8), needs no catalog and could ship first. Part B, feed fetch, verify and enforce, waits on
         #161.
      2. **Fetch cadence and failure mode.** Default: periodic fetch; when the feed is unreachable or stale, keep the
         last verified advisories and show their age. Never treat a missing feed as "no advisories" silently, and
         never as a reason to block existing apps.
      3. **Where the feed URL and key set come from.** Owner-managed file configuration.
      4. **Where warnings show.** Control Center Settings, Apps, next to paired names (section 16).
      5. **Enforcement point.** `block_new_pairing` only at pairing-code creation; existing tokens keep working;
         revocation stays an owner click.

      Acceptance once decided: tests for each advisory level, for tampered or unsigned feeds being ignored, and
      proving no code path uninstalls, deletes or revokes without an explicit owner action.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: per-app-provider-credentials
    kind: feature
    title: "Isolate per-app provider API keys and billing policy"
    body: |
      User-level file-backed provider API-key fallback exists, but an app cannot supply its own isolated provider
      billing configuration. Add this without storing plaintext provider credentials in SQLite or returning them from
      any API.

      Design questions:
      - whether app-builder keys are installed by the owner, paired out of band, or referenced from an OS secret store
      - per-app default vs fallback policy and provider/model allowlists
      - attribution of usage/cost to the app, user and credential source
      - revocation and session behavior when a key disappears
      - preventing one app from selecting or observing another app's key

      Prefer opaque secret references backed by the OS credential store or owner-managed files. Extend backend status,
      notices and usage tallies to identify the billing source without exposing secret material.

  - key: docker-desktop-autostart
    kind: check
    title: "Verify Docker Desktop and daemon recovery across a cold reboot"
    body: |
      Docker Desktop's autostart setting is enabled, but the complete dependency chain has not been verified after a
      cold Windows reboot.

      Exit test:
      - reboot without manually opening Docker Desktop
      - confirm Docker, the CLI egress proxies and required harness networks become available
      - confirm the scheduled daemon/model supervisors recover without manual intervention
      - verify `/health`, backend login status and a small hosted-provider session
      - record startup ordering/race fixes if the daemon begins before Docker is ready

  - key: mac-xcode-setup
    kind: check
    title: "Install and verify Xcode prerequisites for native iOS client work"
    body: |
      Xcode is still required before building a native iOS client or companion for the harness. This is a user-machine
      setup check, not an Agent Harness Server code feature.

      Verify Xcode and command-line tools on the MacBook, accept the license, select the active developer directory,
      and build/run a minimal Swift project. Record the supported macOS/Xcode versions before scoping any native iOS
      Agent Harness companion work.

  - key: session-header-tabs-quotes
    kind: feature
    title: "Session page: drop the truncated title, stop the chat/changes swipe loop, link quotes to sources"
    body: |
      Phone feedback from a live session on iPhone.

      **Truncated header title.** `setHeader("agents", session.title)` puts the session title to the right of the
      Agents dropdown. Long titles (e.g. "Phase 8a…") render as "phase…" and are too small to read. Remove the title
      from the header. If it is still useful, show it on the session page itself (transcript heading or Info), not
      in the chrome.

      **Chat ↔ Changes swipe loop.** Transcript / Changes / Info still assign `location.hash`, which pushes history.
      Swiping back from Changes returns to the bottom of the chat; swiping forward (or tapping Changes again) returns
      to Changes, and the pair loops. Treat those three as tabs: replace the current history entry when switching,
      and do not use `history.back()` for a tab change. Keep a real back stack only for leaving the session.

      **Quoted sources as links.** If the agent quotes a document or webpage it read, the quote in the transcript
      should be a link that opens that source, ideally scrolled to the quoted passage.

      Difficulty: moderate for web pages, harder for files.
      - Grounding (`harness/grounding.py`) already checks that a quote appears in concatenated tool output, but it
        does not remember which `web_fetch` URL or file produced it. Attribution is the missing piece.
      - Web: once a quote is tied to a URL, wrap it in a link. Chrome/Edge can deep-link with a text fragment
        (`#:~:text=`). Safari/iOS support is partial (16.4+). Pages that block fragments still open at the top.
      - Local files, PDFs and memory-library notes have no public URL. Those need a harness viewer or a jump to the
        tool-result in the transcript, not a web link.
      - Suggested slice: web_fetch quotes first (store URL + quote, render `<a>`). Files/PDFs later.

  - key: settings-pages-overhaul
    kind: feature
    title: "Settings: themes, backends as controls, memory editor, and clearer apps/endpoint/disk pages"
    body: |
      Phone feedback after the Profile landing + Settings list split. Keep GPU and Claude Remote Control on the
      Profile landing; fix the Settings pages below.

      **Appearance.** The page is the emoji picker, which is already reachable from the identity row ("click your
      profile"). That is misleading. Appearance should be visual: a few sample themes, or controls to set the three
      main hues (background, panel, accent). Keep the icon picker on the identity card only.

      **Install.** Useless once the PWA is on the phone. Hide it when `display-mode: standalone` / `navigator.standalone`,
      or remove the page.

      **Hosted backends.** Drop the long provider-terms paragraphs. Show Claude, Codex, Cursor **and the hosted Qwen
      (local) connection**. Let the user pick each backend's default model and effort. Clean up the cost counters
      (today they mix `$0.0000` estimates with subscription usage percents).

      **Memory library.** The agent-profile blob injected into every new session currently includes personal
      biographical detail, and the page dumps that text plus a character count. Rewrite the profile to a short
      purpose statement (how agents should use the library), make it editable on this page (save through the
      existing approved-write path), and replace the description with one line on what the document is for.

      **Apps.** "New app" is opaque. Explain up front that this mints a scoped API token so another program can
      start/follow sessions on this daemon (link to `docs/app-api.md` in plain language). The create flow should
      say what the token is, that it is shown once, and what each permission allows, before anyone taps Create.

      **Inference endpoint.** Put the OpenAI and Anthropic base URLs in horizontally scrolling code boxes with tap
      to copy. Make the new-key flow a short form (name → create → copy-once warning) instead of `window.prompt`.

      **Disk.** Tower and MacBook report free space in different shapes (tower: "N GB free of M GB" plus workspace
      quotas; Mac: "online · N GB free · runner …"). Use one layout per device (free / total, then what is using
      space). Label **Clean up now** with what it removes (stopped sandbox containers, expired session workspaces
      and orphans) and confirm before running.

  - key: session-sticky-title-jumps
    kind: feature
    title: "Session page: sticky editable title and jump-to-end arrows"
    body: |
      Phone feedback after #32 moved the title out of the header and onto the scrolling page.

      **Title always in view, and editable.** `h2.session-title` sits in the scrolling transcript, so a long thread
      hides it. Keep the title visible for the whole session (sticky under `#bar`, or in the chrome without going
      back to the old truncated header title). Tapping it should rename the session. Titles are set only at create
      today; there is no `PATCH /sessions/{id}`. Wrap rather than ellipsize. Same title on Transcript / Changes / Info.

      **Jump arrows when far from an end.** A long thread can leave the user many screens from the top or bottom.
      When more than about two viewports from the top, show an ↑ that scrolls to the start. When more than about two
      viewports from the bottom, show a ↓ that scrolls to the end. Hide each arrow when that end is already in view.

      The existing `.jump` ("↓ Latest") only appears when follow-mode is off and new output arrives. Extend or replace
      it so both directions work for reading old history, not only catching up to a live stream.

  - key: header-top-inset
    kind: feature
    title: "Tighten the extra space above the app header"
    body: |
      Phone feedback after the 2026-09-16 iPhone header change.

      `#bar` padding is `env(safe-area-inset-top) + 20px` so content sits below the Dynamic Island / Control Center
      fade. That extra 20px now looks like too much empty space above the Agents dropdown (and above the ‹ title on
      Profile/Settings pages).

      Reduce the extra inset while keeping the bar out of the status-bar overlap. Check both the feature-nav header
      and `#bar.page`.

  - key: appearance-theme-chips
    kind: feature
    title: "Appearance: drop the color grabber, preview custom hues, split System light/dark"
    body: |
      Phone feedback on Settings → Appearance after #33.

      **No page-sampling grabber.** The custom hue controls are native `input type=color`. On iOS the picker includes
      an eyedropper/grabber that only samples the Appearance page itself, so it is useless. Remove that control.
      Keep a way to set background, panel and accent (palette, sliders, or hex) that does not rely on sampling the
      current screen.

      **Custom chip shows the saved hues.** `THEMES.custom.swatch` is hardcoded `#888888` / `#aaaaaa` / `#2563eb`.
      Only the accent stripe reads `harness.themeHues` today, and only while painting the third span. The Custom
      tile should show the three stored custom colors (bg, panel, accent) even when Custom is not the active
      profile, so you can see what Custom is before selecting it.

      **System is light and dark.** The System tile currently uses the light swatch only (`#f6f7f9` / `#ffffff` /
      `#2563eb`), so it looks like Light. Split it with a diagonal so one side is the light palette and the other
      is the dark palette.

  - key: header-inset-ios-blur
    kind: feature
    title: "Header: sit below the iOS status-bar blur without a large empty band"
    body: |
      Phone feedback after #35 reduced `#bar` padding from `env(safe-area-inset-top) + 20px` to `+ 8px`.

      The Agents dropdown and Profile/Settings titles are too close to the top again and are being blurred by iOS
      (Dynamic Island / Control Center / `black-translucent` status bar). `+ 20px` was too much empty space; `+ 8px`
      is too little.

      Pick a middle extra inset (and keep the bar opaque) so the controls sit fully below the system fade on the
      installed PWA. Check both the feature-nav header and `#bar.page`. Headless screenshots are not enough:
      `safe-area-inset-top` is 0 there.

  - key: session-rename-method
    kind: feature
    title: "Session rename: PATCH /sessions/{id} returns 405 Method Not Allowed"
    body: |
      Phone feedback after #34. Tapping the sticky title, editing it, and blurring/saving toasts **Method Not Allowed**.

      The PWA already sends `PATCH /sessions/{id}` `{title}` (`harness/web/app.js`). FastAPI defines that route in
      repo `3f03c62`, and unit tests pass against `create_app()`. The live tower daemon does not: `PATCH` and
      `OPTIONS` on `/sessions/{ref}` return 405, and the process OpenAPI has no PATCH on that path. Static `app.js`
      is served from disk, so the phone got the new UI without the new Python route.

      Fix: restart `AgentHarness-Daemon` so it loads `3f03c62`. If 405 remains, Tailscale Serve or another proxy may
      be blocking PATCH; add a `PUT` alias (or another allowed method) and point the PWA at that.

      Confirm on the phone after the daemon is running the new code: rename, reload, title sticks on the session
      page and in the session list.

  - key: session-jump-closer
    kind: feature
    title: "Session jump arrows: show when closer to the top or bottom"
    body: |
      Phone feedback after #34. The ↑ / ↓ buttons do not appear in ordinary threads.

      `bindSessionJumps` hides each arrow until the reader is more than **two viewports** from that end
      (`2 * window.innerHeight`). A typical session is shorter than that. On iPhone (390×844) a ~1967px transcript
      at the bottom is only ~1123px from the top, so ↑ stays hidden the whole time.

      Show the arrows sooner — around half a viewport to one viewport from the end, not two. Still hide an arrow
      when that end is already in view. Check a short finished session and a long live one, on Transcript and on
      a long Changes page.

  - key: settings-memory-page
    kind: feature
    title: "Settings Memory: rename the page and enlarge the profile editor"
    body: |
      Phone feedback after #33.

      **Rename.** Settings still labels the page **Memory library**. Call it **Memory**. Keep the hash
      `#/profile/memory`.

      **Taller editor.** The profile textarea is `rows: 8` with a 140px min-height, so most of the document sits
      behind a tiny box. Make the edit box tall enough that it extends the widget and fills most of the page
      below the short purpose copy (phone-first).

  - key: appearance-profile-and-app-icon
    kind: feature
    title: "Appearance: say profile icon, and let the user pick a home-screen app icon"
    body: |
      Phone feedback after #33 / #36.

      **Copy.** Appearance says "The icon lives on your profile card." That does not say *profile* icon, so it
      reads as if the home-screen / app icon were on Profile. Say that the **profile icon** (the emoji next to
      the name) lives on the Profile card.

      **Home-screen app icon.** The unclear copy also makes the missing control obvious: Appearance should offer
      a few application-icon options for the PWA home-screen icon, separate from the in-app profile emoji.
      iOS keeps the icon from Add to Home Screen, so say that applying a new one means removing the app and
      adding it again.

  - key: backends-popular-models
    kind: feature
    title: "Backends: popular model presets plus a custom name"
    body: |
      Phone feedback after #33. Hosted backends (Claude, Codex, Cursor) currently use a free-text model field.

      For each platform, show the few most-used models as a select, plus **Custom** with a text field so the
      user can type any model name the CLI accepts. Local Qwen can keep listing configured models.

      Suggested starters (update if the CLIs rename them):
      - Claude: `claude-opus-5`, `claude-sonnet-5`, `claude-haiku-4-5`
      - Codex: `gpt-5.6-sol`, `gpt-5.6-terra`, `gpt-5.6-luna`
      - Cursor: `cursor-grok-4.6-high`, `composer-2.5-fast`, `gpt-5.6-sol-medium`

      If the saved model is not in the list, select Custom and fill the text field.

  - key: disk-page-layout
    kind: feature
    title: "Disk: remaining layout cleanup"
    body: |
      Phone feedback after #33, which already asked for one layout per device. The page is still messy:
      `.disk-meter` is only two text spans (not a bar), Tower dumps workspaces / containers / backup into one
      jumble, and MacBook only reports free space (no total) plus a runner/version line.

      Use one layout per device: name, a real used/free bar, "N GB free of M GB", then labeled rows for what is
      using space. Keep **Clean up now** in its own block with the existing confirm copy. Have the Mac runner
      report `total_gb` so both machines can use the same meter.

  - key: scratch-not-a-repo
    kind: feature
    title: "Scratch: empty per-session folder, not a new git repo or project"
    body: |
      Phone question after using New task → scratch.

      **Current behavior.** `scratch` (and `mac-scratch`) are fixed entries in `config/projects.yaml`. Starting a
      scratch task does **not** create a git repository and does **not** add a new selectable project. Each session
      gets a fresh empty directory under the data dir (`workspaces/<session-id>` on the tower, or the Mac runner's
      workspaces folder). There is no clone, no `agent/<id>` branch, and no Review merge/push. Cleanup deletes that
      folder after retention. The project name stays `scratch` every time.

      **Why it exists.** A disposable sandbox for prompts that aren't tied to a code repo (questions, one-off files,
      experiments). Homelab-without-repo sessions work the same way: empty workspace plus host tools.

      Capture this so New task can explain it (or so scratch can later mint a real repo/project if that's wanted).
      Do not change the runtime in this issue until that's decided.

  - key: remote-control-homelab
    kind: feature
    title: "Remote Control card omits homelab because it has no local repo folder"
    body: |
      Phone feedback: Actions → Claude Remote Control lists invoice-tools, plex-webhook, observability-stack, but
      not **homelab**.

      This is intentional with the current rule, not a list bug. `RemoteControl.folder()` only accepts tower
      projects whose `repo` is a local directory (`harness/remote_control.py`). `homelab` in `config/projects.yaml`
      has `homelab: true` and **no `repo`**, so `eligible()` skips it (same as `scratch`). Claude Code Remote Control
      has to start in a folder; there isn't one.

      Decide one of:
      - leave it omitted, and say on the card that only tower projects with a local folder appear
      - point homelab at a real folder (e.g. `D:/Docker`) so a server can be launched there
      - add a separate "open Claude in the homelab root" path

      Tests already encode the skip: `eligible() == ["repo"]  # scratch has no folder, remote is a URL`.

  - key: new-task-header
    kind: feature
    title: "New task: header is busy again with truncated text"
    body: |
      Phone feedback on `#/new`. The header shows the Agents dropdown plus a truncated page title.

      `viewNew` calls `setHeader("agents", "New task")` without `{ page: true }`. That leaves the profile icon and
      feature switcher visible and puts "New task" in `#title` beside them — the same cramped truncated-title
      pattern #32 removed from session pages.

      Use the Profile/Settings page header (`{ page: true }`: ‹ plus the title, switcher hidden), or drop the
      in-chrome title and put "New task" on the page. Check New job (`setHeader("jobs", "New job")`) for the same
      pattern.

  - key: header-inset-a-few-more
    kind: feature
    title: "Header: move a few more pixels below the iOS status-bar fade"
    body: |
      Phone feedback after #37 set `#bar` extra padding to `env(safe-area-inset-top) + 14px`. The Agents dropdown
      and Profile/Settings titles still sit a few pixels too high under the iOS status-bar / Control Center fade
      on the installed PWA.

      Bump the extra inset a little (about 18px, still under the old +20px that looked like an empty band). Keep
      the bar opaque. Check both the feature-nav header and `#bar.page` on the phone; headless shots are not
      enough (`safe-area-inset-top` is 0 there).

      Scaling: the `env(safe-area-inset-top)` part already follows the device (0 on desktop, larger on Dynamic
      Island phones). The extra pixels are a fixed fudge for the translucent status-bar blur that extends below
      the safe area. They do not follow Dynamic Type. Do not invent a per-model table unless +18px still fails
      on this iPhone.

  - key: remote-control-harness-and-memory
    kind: feature
    title: "Remote Control: add agent-harness and the memory library"
    body: |
      Phone question after #45. Actions → Claude Remote Control lists tower projects with a local `repo` folder.
      The user wants to start native Claude in **agent-harness** and in **agent-memory-library** the same way.

      This is a `config/projects.yaml` (and maybe `remote_control.projects`) change once the folders exist, not a
      list bug. Neither project is in `projects.yaml` today (memory-library is only a commented example).

      Remote Control is an unmodified `claude` process on the tower, not a Docker sandbox. It can read gitignored
      files in that folder, run git with the host credentials, and edit the live tree.

      **agent-harness** (`D:/Projects/agent-harness`): moderate-high operational risk. The daemon serves
      `harness/web` from disk, so UI edits apply on reload; Python changes apply on restart. Local config next
      to the repo is gitignored but readable. The GitHub remote is public.

      **agent-memory-library**: higher privacy risk. Harness agents only see allowlisted categories through the
      daemon clone. Native Claude in the library folder would see the whole tree, including categories those
      agents cannot read. Decide whether Remote Control opens the user's working copy or the daemon clone
      (`memory_library.clone_dir`), and do not point it at a path that would publish private notes.

      If added, keep the existing one-time Claude workspace-trust step. Do not widen Remote Control to MacBook
      projects in this issue.

  - key: jobs-fab-align
    kind: feature
    title: "Jobs: put + New job in the same spot as + New task"
    body: |
      Phone feedback. The scheduled-jobs list still shows **+ New job** in a different place than **+ New task**
      on the Agents list.

      Both already append `a.btn.new-task.fab` with the same CSS (`right: max(16px, env(safe-area-inset-right))`,
      `bottom: calc(env(safe-area-inset-bottom) + 20px)`). Make them match on the iPhone: same corner, size,
      safe-area inset, and visual weight. If a leftover composer, jump button, or page-specific overlay is
      shifting Jobs, remove it. Verify both list pages, including the empty Jobs state.

  - key: slow-form-pages
    kind: feature
    title: "New task, New job, and Backends pages wait on live CLI login checks"
    body: |
      Phone feedback: Settings → Backends, `#/new`, and `#/jobs/new` now take a noticeable time to appear.

      All three `await api("/backends")` before painting. `GET /backends` builds each hosted backend with
      `backend_state.view()`, which runs a Docker `claude auth status` / `codex login status` / `agent status`
      check (30s timeout) **sequentially**. New task and New job only need the backend names/models for the
      form; they should not wait on those probes.

      Paint the page first (cached or cheap backend list). Load login/usage/limits in the background. Prefer
      parallel checks and a short TTL cache for `GET /backends` so Settings → Backends is fast on a second
      visit too.

  - key: cursor-drop-openai-models
    kind: feature
    title: "Cursor model picker: drop GPT-5.6 Sol after OpenAI ended the Cursor deal"
    body: |
      Phone feedback on Settings → Backends. The Cursor popular-model list includes `gpt-5.6-sol-medium`
      labeled **GPT-5.6 Sol** (`harness/backend_state.py` `POPULAR_MODELS["cursor"]`).

      OpenAI announced it is winding down model access for Cursor after the SpaceX acquisition (proposed
      cutoff 2026-11-12; no future OpenAI models). Treat the OpenAI ids as invalid presets for Cursor even
      if Custom can still type them.

      Remove `gpt-5.6-sol-medium` (and any other OpenAI GPT ids) from the Cursor starter list. Keep
      `cursor-grok-4.6-high` and `composer-2.5-fast`, and add another current Cursor-native id if a third
      slot is useful. Leave Custom so a typed name still works. Do not change the Codex list in this issue.

  - key: appearance-text-size
    kind: feature
    title: "Appearance: in-app text size"
    body: |
      Phone feedback on Settings → Appearance after #36.

      Add a control to scale text inside the Control Center (this device only, like theme). Persist it
      (e.g. `localStorage`) and apply it to the UI. Keep the 16px minimum on focused inputs so iOS does
      not zoom. Check session transcript, session list, Settings pages, and the header.

  - key: session-card-double-tap
    kind: feature
    title: "Session list: old session cards take two taps to open"
    body: |
      Phone feedback on the Agents list. Opening an older session card needs two taps; it should open on
      the first.

      Cards are `a.card` with `href="#/s/<id>"`. `viewList` rebuilds the list with `replaceChildren` on a
      300ms-debounced `/events` refresh and on becoming visible again, which can drop the tap that was in
      flight. iOS also sometimes eats the first tap after a scroll.

      Open on the first tap for finished and live sessions. Keep the machine filter and search working.
      Check after scrolling a long list.

  - key: guest-demo-access
    kind: feature
    title: "Guest/demo access for a tailnet buddy without the full owner UI"
    body: |
      The user wants to show the Control Center to another SWE for a couple of hours by adding them to the
      tailnet.

      Today the PWA is an owner console. `tailscale serve` sends `Tailscale-User-Login`; `allowed_logins`
      (in untracked local config) is a single owner login. A tailnet peer who is not on that list gets 403.
      A peer who is added gets **everything** the owner can: all sessions and transcripts, start/cancel,
      approvals, GPU pause, Remote Control, memory editor, inference keys, Review merge/push.

      There is no guest, read-only, or time-boxed role. App API scoped tokens exist but the PWA does not
      use them. Distinct from #24 (owner API) and #25 (browser pairing/CORS).

      Add a way to let a named tailnet login look around for a limited time without owner powers. Default
      should stay "this login is the owner." Do not put real logins, tokens, or tailnet names in the
      public issue comments.

  - key: profile-account-page
    kind: feature
    title: "Profile identity: open an account page instead of toggling the icon picker"
    body: |
      Phone feedback on `#/profile`. Tapping the identity card shows/hides the emoji picker on the same
      page (`picker.hidden = !picker.hidden`). It used to feel like a subpage (chevron) and should again.

      Navigate to a real Profile subpage (e.g. `#/profile/account`) with the usual `{ page: true }` header.
      On that page show:
      - the profile icon picker
      - account/profile information (`GET /me` name and Tailscale login, without extra secrets)
      - connection details (public URL, whether the live stream is connected)

      Keep GPU and Claude Remote Control on the Profile landing. Do not dump Settings onto this page.

  - key: images-page-warmup-progress
    kind: feature
    title: "Images: warmup ComfyUI on open, real progress, unload immediately, in-app fullscreen"
    body: |
      Phone/Control Center feedback from the Image generation page (`#/images`). The page works, but the wait is
      long and several status/navigation details fight the user.

      **Warm up ComfyUI when the Images tab opens.** Opening `#/images` should start the ComfyUI process immediately
      so Generate is not paying the ~45s boot. Do **not** load the diffusion checkpoint yet if that is possible —
      the model should load only when a job actually runs. Guests/demo can view the gallery but cannot generate; do
      not warm up for them.

      VRAM constraint from Phase 6d: Qwen (~14.7 GB) and an image model do not fit together, and an idle ComfyUI can
      still hold a CUDA context. Prefer a ComfyUI process that is listening without a loaded checkpoint and without
      stealing the LLM's VRAM. If a CUDA context is unavoidable, unload the language model when the Images tab is
      opened (the user is signaling intent) rather than waiting for Generate, still without loading the image
      checkpoint until a prompt is submitted. `harness/images.py` currently starts ComfyUI only inside `_run_batch`
      after exclusive GPU hand-over.

      **Loading status shows six periods, and only the last three animate.** Phase copy in `IMAGE_PHASE` already ends
      with a Unicode ellipsis. The renderer then wraps that text in `.dots`. Drop the ellipsis from the phase
      strings (or stop applying `.dots` on copy that already has one). After immediate unload, the lingering phase
      should go away.

      **During actual generation, show a progress bar instead of a seconds counter.** Surface ComfyUI websocket
      `progress` (`data.value` / `data.max`) as `progress.value` / `progress.max`, and keep an indeterminate bar
      while queued / starting / loading the checkpoint. Reuse `progressBar()` in `harness/web/app.js`. Poll faster
      while `phase === "generating"`.

      **When the last job finishes and the queue is empty, unload immediately and give the GPU back to the LLM.**
      Skip `linger_seconds` (currently 60). Delete lingering copy so a leftover `progress.seconds` is never appended.

      **Clicking the image on a result card should open an in-app fullscreen page** (e.g. `#/images/<id>/full`),
      not `target="_blank"` to the raw PNG.

      Suggested slice: doubled ellipsis → immediate unload → step progress → warmup without checkpoint → fullscreen
      viewer. Distinct from #12 (backups/upscaling/inpainting) and #13 (extra workflows).

  - key: webapp-user-projects
    kind: feature
    title: "Create projects from the Control Center, scoped to the user who created them"
    body: |
      New projects today mean editing `config/projects.yaml` on the tower and restarting. The Control Center
      can start a session in an existing project but cannot create one. Every project and session is global:
      a #54 guest can still GET the full project list, session list, and transcripts (read-only).

      **Create from the webapp.** From New task (or a Projects page), the owner can add a project without YAML:
      a name, optional description, tower vs MacBook target, and either an empty workspace (like scratch) or a
      local folder / git URL to clone. Persist it so New task lists it after reload. Creating a git project
      should produce a real repo the Review card can merge/push, not another disposable scratch folder (#44).

      **Scope to the creating user.** Projects, sessions, transcripts, workspaces, and Review belong to the
      user who created them. A guest/demo login must not see the owner's projects or sessions (empty list or a
      dedicated demo fixture). Today #54 only strips mutations; GET `/projects` and `/sessions` still return
      everything. The app API already scopes sessions to the creating app token; the PWA should get the same
      idea for people.

      **Later: a second household user.** A roommate (or similar) should be able to set up their own account on
      the same daemon, create their own project, and run it on the local LLM without seeing the first user's
      work. Optionally they connect *their* GitHub account and clone *their* repos into an isolated workspace,
      in the spirit of Cursor's cloud agent (their credentials, not the host git login). Do not store provider
      or GitHub tokens in SQLite or return them from any API (same bar as #29).

      **Later: Google sign-in for the Control Center.** Tailscale identity is enough for a single owner plus a
      named guest. A second real user on the same tailnet, or a browser that is not Tailscale-authenticated,
      needs an account. Google OAuth is a candidate so the PWA is not only "whoever `tailscale serve` says."
      Keep the tailnet as the network boundary. Distinct from #25 (app/browser pairing and CORS).

      GPU guard, homelab tools, Remote Control, inference keys, and machine Settings stay owner/host
      operations until a later issue says otherwise.

      Suggested slice: create-project in the PWA for the single owner → attach an owner identity to projects
      and sessions so guests see none of them → multi-user accounts → per-user GitHub clone → Google login.
      Distinct from #16 (`harness projects add` on the Mac CLI) and from #54 (guest is currently a read-only
      window onto the owner console). Do not put real logins, tokens, or tailnet names in public comments.

  - key: text-size-chrome-clip
    kind: feature
    title: "Appearance: large text size clips labels in the header and other fixed chrome"
    body: |
      Phone feedback after #52 (`harness.textSize` / `--text-scale` on `html` font-size). At Large / Extra,
      labels in fixed-width chrome no longer fit.

      Example: the feature switcher option **Image generation** (`#feature-nav` in `index.html`) renders as
      **image genera**. `#feature-nav` is `max-width: 190px` with no wrap (`style.css`). **Scheduled jobs**
      is the same class of bug. Other likely hits: the sticky `#bar` title (`white-space: nowrap` + ellipsis),
      the + New task / + New job FAB, Settings list rows, and chips that assume Default (16px) metrics.

      The control should still scale transcript, session list, Settings copy, and the header. Do not clip
      mid-word. Prefer letting the switcher grow, wrap onto two lines, or use a shorter label at large sizes
      — pick whichever keeps Agents / Jobs / Images readable at Extra on iPhone. Recheck Default so this
      does not reintroduce the empty-band / truncated-title problems from #32 / #35.

      Distinct from #52 (the size control itself) and from transcript table wrapping.

  - key: transcript-table-mobile
    kind: feature
    title: "Session transcript: markdown tables wrap mid-word on a phone"
    body: |
      Phone feedback on agent answers that include markdown tables. On a mobile viewport the table is too
      wide, and cell text wraps character-by-character instead of staying readable.

      `md()` in `harness/web/app.js` turns `| ... |` blocks into `<table>`. `.msg table` is already
      `display: block; overflow-x: auto`, but `.ev` sets `overflow-wrap: anywhere`, so `th`/`td` wrap
      mid-word and the table never grows wider than the screen. Horizontal scroll never helps.

      On a phone, keep each markdown row as one visual row: cells should not wrap letter-by-letter.
      Scroll the table sideways when it is wider than the transcript. A slightly smaller table font is
      fine if it reduces scrolling. Check Default and Extra text size, and a 3–6 column table from a
      live answer.

      Distinct from #52 / text-size chrome clipping. Do not change code-block wrapping in this issue.

  - key: household-user-accounts
    kind: feature
    title: "Add owner-provisioned household accounts with strict isolation"
    body: |
      V1 owner-provisioned members authenticate by exact Tailscale identity and receive a stable opaque user ID.
      Preserve existing owner data and paths as user `owner`; require an explicit owner allowlist before the first
      member. Central principal resolution and repository/service-layer scoping isolate projects, sessions, events,
      approvals, transcripts, review, search, workspaces, files, queue data, and counts. Owners administer member
      status and aggregate usage but ordinary owner surfaces do not reveal member content.

      Add the member-safe first-party API/Agent Harness Web path without granting `/api/admin/v1`; bind App/device tokens
      to owner scope and stop unauthenticated discovery from exposing projects. Member projects are tower-only empty
      workspaces or credential-free public HTTPS clones on the existing host allowlist, rooted under opaque per-user
      directories with traversal/symlink/junction protection. Hosted providers, private Git credentials, runners,
      homelab, memory, images, Remote Control, inference keys, jobs, notifications, maintenance, and machine settings
      remain owner-only. Default each member to 20 GiB aggregate storage, one running and two queued local sessions;
      keep global FIFO/GPU controls. Disable cancels work and blocks access but retains data. #63 and #64 stay downstream.

  - key: per-user-github-clone
    kind: feature
    title: "Add isolated member GitHub authentication for private repositories"
    body: |
      After #62 lands, let an enabled member authorize their own GitHub account for private HTTPS clone/fetch
      and the existing reviewed push flow. V1 uses an owner-pinned Git Credential Manager executable, forced
      device flow, an approved OS-backed store, and `agent-harness/v1/<opaque-user_id>` credential namespaces.
      A host-side broker relays the short-lived verification URL/code but never exposes token output to the
      daemon or web app. Normal Git operations are noninteractive and never fall back to owner/default credentials.

      Only the member can connect/disconnect; the owner sees coarse state and may perform an erase-only reset.
      Persist non-secret state only. Revocation/401 erases the rejected namespace and requires reconnect. Disclose
      that GCM's built-in GitHub OAuth grant is broad (`repo`, `gist`, `workflow`) rather than repository-scoped.

      Accept only canonical `https://github.com/<owner>/<repo>[.git]` URLs. Every credentialed operation uses a
      scrubbed environment, isolated configs, the pinned helper, explicit stored origin, disabled hooks/filters,
      HTTPS-only transport, and revalidated member ownership/containment. Never initialize submodules, fetch LFS,
      or put GCM/credentials in a sandbox. Push only the reviewed session branch to its stored origin after explicit
      member confirmation. Public member clones remain credential-free; existing owner Git behavior is unchanged.

      The API/UX, adversarial two-member isolation matrix, store preflights, URL/config fuzzing, lifecycle races,
      real-store smoke test, redaction checks, documentation, and full acceptance contract are specified on #63.
      Keep `needs-refinement` until household-user-accounts (#62) merges; then move directly to `ready` after a
      dependency audit rather than reopening product design.

  - key: google-signin-control-center
    kind: feature
    title: "Add Google sign-in for pre-provisioned members in Agent Harness Web"
    body: |
      After #62, Google OIDC may identify an already provisioned member in bundled, same-origin Agent Harness Web.
      Tailscale Serve remains required network admission, but an allowed Google `sub` selects the member principal;
      Google never self-provisions, becomes owner, bypasses a conflicting owner/member Tailscale identity, or enables
      public/LAN access. Preserve direct exact-Tailscale member login.

      Use server-side authorization code + PKCE, exact HTTPS callback, state/nonce, discovery/JWKS validation, and
      only `openid email profile`. Persist stable `sub` plus presentation metadata, never Google tokens. Enrollment
      is member self-link or a hashed 15-minute single-use owner invitation for an existing member. Local sessions
      use hashed opaque IDs and a Secure/HttpOnly/SameSite=Lax `__Host-` cookie with 7-day idle/30-day absolute
      expiry, exact-origin CSRF protection, immediate revocation, and Tailscale/principal re-checks on every request.

      V1 is bundled Web only; a separately hosted Web member session needs a later cross-origin design. Client secret
      stays in an owner file, and setup fails closed if the exact tailnet callback cannot meet Google's domain policy.
      Full identity matrices, OIDC/session adversarial tests, lifecycle UX, privacy rules, and docs are specified on
      #64. Keep `needs-refinement` until household-user-accounts (#62) merges, then dependency-audit for `ready`.

  - key: daemon-config-ui
    kind: feature
    title: "Add a typed Agent Harness Server configuration registry with safe App/admin boundaries"
    body: |
      Implement an explicit allowlisted SettingSpec registry; never generic dotted reflection or YAML editing. Safe
      host operational values use a flat versioned data-directory JSON overlay with revision checks, transactional
      validation/live hooks, pending restart values, and one last-known-good generation. Preserve the loader's actual
      field-specific base/local/profile semantics. Existing backend preferences migrate into the registry.

      Agent Harness Apps get only per-token narrowing defaults (backend/model/effort, capped budgets, subsets of already-granted
      capabilities, and notification silence) and can never mutate host settings or expand authority. Admin APIs and
      schema-driven Agent Harness Web UI expose the exact safe registry; paths, secrets, identity, modules/profile,
      sandbox/network/egress, providers, runners, homelab, memory, Remote Control, and unregistered values remain
      installer/file-only. Restart-required candidates use the existing cross-platform supervisors without shelling
      out or elevation; unsupervised runs refuse restart, and failed/unconfirmed candidates automatically restore
      LKG without masking invalid base config. #67 consumes this registry later.

  - key: chat-home
    kind: feature
    title: "Make Chat the Agent Harness Web home with model selection and a navigation drawer"
    body: |
      Make a lightweight, durable Chat experience the Agent Harness Web default landing page. It wraps configured
      local or hosted backends for ordinary questions, search/fetch, and pasted-code review without creating
      a project worktree, review branch, or agent workflow.

      Decisions (2026-09-17):
      - choose backend, model, and reasoning effort before the first send; they stay fixed for that chat
      - persist an explicit non-agent conversation kind with resumable provider session ids and owner-only history
      - use an empty non-project workspace and deny file, shell, git, edit, Remote Control, approval, and Review tools
      - derive the initial title from the first message and allow owner rename/delete
      - guests retain their current read-only role and cannot create/send chats or see owner chat history
      - code is reviewed as text; execution is split to the chat-snippet-runner issue

      The root route opens Chat. Its mobile-safe composer streams/cancels through the existing backend contract.
      A left drawer links Chat, Agents, Tasks, Images, recent non-agent chats, and Profile; Profile also remains in
      the Chat header. Preserve provider availability, usage/limit warnings, safe areas, accessibility, and large text.

      Coordinate with the Agent Harness Web/Server/API stack (#23/#24/#27); implement from the settled merged stack.
      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: chat-snippet-runner
    kind: feature
    title: "Chat: run pasted snippets in an isolated ephemeral sandbox"
    body: |
      Add an explicitly invoked snippet runner after Chat's conversation/API shape exists.

      Decisions (2026-09-17):
      - support Python, JavaScript, Java, C#, and C++; the owner explicitly selects the language
      - scripts run directly; compiled languages use fixed compile/run commands with no arbitrary flags
      - use pinned toolchain images/digests and report their exact versions
      - standard libraries only: no packages, network, caches, user binaries, or host/project/secret mounts
      - require an explicit Run action on a supported fenced block or manual editor; the model cannot invoke it
      - each fresh sandbox is limited to 30 seconds, 1 vCPU, 1 GiB RAM, 64 PIDs, 128 MiB temp, and 1 MiB output
      - persist source and bounded results in Chat; discard files, binaries, and compiler intermediates after every run
      - guests cannot run snippets or access owner Chat history

      Test successful and failing runs for every language plus network/mount denial, limits, cancellation, daemon
      restart, process cleanup, output truncation, and untrusted rendering. Distinct from agent-session run_shell.
      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: admin-fs-browse-remote-locations
    kind: feature
    title: "Add bounded owner-only filesystem discovery for Remote Control folders"
    body: |
      Implementation-grade but blocked on #66. Add a Windows-only, default-off owner setting with at most eight
      validated local fixed-volume roots, depth 1–5, and hard scan/time/result/error limits. This is the sole narrow
      exception to #66's file-only path rule; it must not become a generic path editor. Scans are single-flight,
      cancellable, memory-only, no-follow, metadata/marker-only, and execute no Git, package, file-content, or network
      operations. Skip reparse/sensitive/hidden/cache trees and cover Python, JavaScript, Rust, Go, Java, C#, and C++
      markers.

      Promotion accepts only an unexpired opaque candidate ID, reopens it by canonical path plus Windows volume/file
      identity, revalidates roots and reparse/sensitive boundaries, and atomically adds an owner-only managed Remote
      Control folder. It never trusts, starts, initializes, or deletes anything. Promoted folders stay invisible to
      apps, members, guests, devices, and agent tools; Claude trust remains a separate visible owner action, and every
      trust/launch revalidates the folder. Keep `needs-refinement` until #66 merges.

  - key: profile-actions-menu
    kind: feature
    title: "Profile: Actions menu for GPU hold, Remote Control, and Disk"
    body: |
      Phone feedback on `#/profile`. The Claude Remote Control card is now a long inline widget on the landing
      (every eligible folder as a row with path, trust/start/stop, pairing). The GPU pause control is an operator
      action, not a preference. Settings is already a short labeled list of `#/profile/<section>` links.

      **Add an Actions menu** on the Profile landing, matching Settings (`section-label` + `card settings-list`).
      Place it **above** Settings so operator controls come first.

      **Actions**
      - **GPU** — collapse the landing card into one Actions **row with an on/off toggle**. On means "don't load
        local models right now": do not load the LLM (Qwen / llama-server) or the diffusion checkpoint (ComfyUI).
        Off (default) means local models may load as they do today.

        Optional duration: default **until I turn it off**. Also allow a timeframe (e.g. 30 min / 1 h / 3 h).
        When a duration is set, show remaining time on the row; auto-clear when it expires (same as turning the
        toggle off).

        Reuse the existing GPU-guard pause path (`POST /gpu/pause|resume`, pause flag, queue wait) rather than a
        second GPU system. Extend it so diffusion is held too. While the hold is on: do **not start ComfyUI at
        all** (no portable-install launch, no #56 Images-tab warmup, no "listening without a checkpoint"). Image
        jobs may sit in the image queue only. Skip the PWA's `POST /models/warm`. Do not load Qwen or a diffusion
        checkpoint until the hold is off or expired.

        Automatic game / Plex GPU-guard stays. This toggle is the manual hold (today's "Pause agents (I'm gaming)").
        If a game or transcode is active, the row can show that as status; it is not a second switch.

      - **Claude Remote Control** — move the current landing widget to a subpage (e.g. `#/actions/remote-control`).
        Keep the existing start/stop/trust/pairing UI and polling; do not redesign the card, just stop embedding
        it on `#/profile`.
      - **Disk** — move up from Settings. Used/free meters plus **Clean up now** are operator maintenance, not a
        preference. Route is `#/actions/disk`.

      **Local-model menus (warning + queue)**
      When the GPU hold is on, attempting to use a **local** model from its menu must warn that the request can
      be queued and that nothing will be sent to the model until the hold is turned off or expires:
      - New task (and New job) when backend is Local model — still allow creating the session/job; it waits
        (`gpu_paused` / existing queue pause). Hosted Claude / Codex / Cursor are unaffected and need no warning.
      - Images — warn on Generate. Do not start ComfyUI on tab open. The job may sit queued.

      Do not block creating the work; block sending it to Qwen or ComfyUI.

      **How queued requests drain when the hold ends**
      Mixed FIFO across kinds is wrong on this GPU. The card holds Qwen (~14.7 GB) or a diffusion model, never
      both; each switch is a long load. A fresh image request already takes a decent amount of time. Interleaving
      session turns and image jobs in arrival order would pick up and drop models repeatedly.

      Drain in two phases, FIFO **within** each kind:
      1. **LLM sessions first** — run every local-model session that waited on the hold (existing `GpuScheduler`:
         one session at a time). Keep Qwen loaded.
      2. **Then images in a row** — one ComfyUI start, run every queued image job, then stop ComfyUI and restore
         Qwen (existing image batch already runs queued workflows in one occupancy).

      Hosted Claude / Codex / Cursor are not in this drain. If new LLM work arrives after the image batch has
      already taken the GPU, keep today's exclusive-image behavior: finish that image batch, then Qwen comes back.

      **Settings stays**
      Appearance, Notifications, Install, Backends, Memory, Apps, Inference endpoint.

      **Leave on the landing**
      Identity → Account only. No GPU card, no Remote Control widget. The session-list pause banner should link
      to `#/profile` (the Actions GPU row is there). Guests can see the row; they cannot toggle GPU, start/stop
      Remote Control, or run cleanup.

      Distinct from #1 (verify automatic game/Plex guard), #45, #48, closed #55/#56, #67.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: client-daemon-version-skew
    kind: feature
    title: "Version skew: Agent Harness Server should tolerate older first-party components"
    body: |
      User-reported incident (2026-09-16): an Agent Harness Server release shipped without the matching Web update,
      so endpoints stopped working until the mismatch was caught by hand. The same risk exists for the
      MacBook runner protocol — #43 already needed "a runner redeploy" just to surface a new `info.total_gb`
      field, i.e. functionality silently lagged behind the Server until someone manually redeployed it.

      There is currently no compatibility contract among first-party components (Agent Harness Server, Agent Harness
      Web, Agent Harness CLI, Mac Runner, and eventually the native installers from #15/#16).
      A Server upgrade can silently break an older component instead of prompting it to update.

      Proposed direction (user, 2026-09-16):
      1. The Server APIs should stay usable by first-party components that are not on the very latest release, not
         assume every component is always current.
      2. A component should be able to detect that the Server has moved past what it supports.
      3. When that happens, it should show clear update instructions, and where possible a button that
         performs or kicks off the update itself rather than just telling the user to go find one.

      Needs refinement:
      - Compatibility window: how many versions back (or how long) does the Server guarantee support for, and
        what happens outside that window — degrade gracefully vs hard-refuse with a clear error?
      - Version/capability handshake: how does each component learn the Server version, and how does the Server
        learn a component version (a header, a `/health` field, something richer)?
      - Confirm this is actually reachable for Agent Harness Web given it is already a served static
        bundle behind a network-first service worker — design the UI for the case that can really occur.
      - Update UX differs by component: Agent Harness Web may just need a reload/cache-bust, but the Mac Runner,
        Agent Harness CLI, and any future native components (#15, #16) are installed binaries — "offer to update" there means
        a real update mechanism (self-download/replace, or at minimum a documented one-liner), not a page reload.

      Distinct from #27 (stabilizing the app SDK/OpenAPI contract for third-party integrating apps — that is
      about the developer-facing API surface staying stable). This issue is about the daemon's own first-party
      first-party components not breaking silently on Server upgrades, and proactively prompting an update. Related to #24's
      "versioned owner-only API" — worth deciding this alongside #24 rather than after, and relevant background
      for the native installers in #15/#16.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: review-diff-comments
    kind: feature
    title: "Review: line comments on the Changes diff, sent back to the agent as one follow-up"
    body: |
      Idea from the Orca comparison (`docs/orca-study.md`). Reviewing a session branch today means reading the diff
      and typing a free-text follow-up that has to re-describe where the problem is. Let the owner comment on diff
      lines instead.

      Proposed shape:
      - On the Changes tab, tap a line (or a small range) to add a comment; comments accumulate as a draft
      - **Send to agent** turns the draft into one structured follow-up message on the same session (file, line
        range, side, quoted line text, comment), so it works for every backend through the ordinary send path
      - store the base/head commit each comment was written against; if the file changed before sending, mark the
        comment stale and quote the current text instead of silently pointing at the wrong line
      - multi-line ranges and deleted-line comments must round-trip (Orca had review-comment bugs here)
      - comments stay owner-only; guests see nothing, members only in their own sessions
      - additive API on the existing session/review surface; no new scope beyond what sending a message needs
      - keep Ask agent to resolve (merge-conflict card) as is; this is the general case

      Test on a phone-width diff (tap targets, safe areas, large text) and with a daemon restart between drafting
      and sending. Related: #24 (owner API), merge-conflict card.

      **Verify before designing.** The Orca research behind this item read only Orca's docs, release notes and
      directory listings, not its source (study: `docs/orca-study.md` tracked in #169, not yet
      merged). Any research or worker task must first clone `stablyai/orca` at a pinned commit (record the SHA), read
      the files below, and confirm or correct the claims in this issue. Paths not yet located are marked; find them by
      searching, do not guess. Do not copy Orca code; reimplement and credit.
      - `src/renderer` and `src/main`: the diff view and the review-comment send-back path (exact files not yet located; release notes mention multi-line review-comment range handling)
      - Orca issues and PRs that mention diff comments or review ranges

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: session-fan-out-compare
    kind: feature
    title: "Fan one prompt out to several backends or models and compare the branches"
    body: |
      Idea from the Orca comparison (`docs/orca-study.md`): "fan one prompt across N agents, each in its own
      worktree, compare, merge the winner." The harness already has a branch per session and a merge/push/discard
      Review card, so most of the plumbing exists.

      Proposed shape:
      - **New task → Compare** takes one prompt plus 2–4 backend/model/effort choices and starts one session each
        from the same base commit, tied together by a group id
      - a group view lists each member's status, elapsed time, tokens/usage, files changed and result summary, with
        the ordinary per-session Changes tab one tap away
      - **Pick winner** runs the existing Review merge (or push) on that member and offers to discard the rest;
        discarding all is one action
      - cap the group size and refuse choices the owner has no quota for: N sessions means N parallel hits on 5h/7d
        limits (the Cursor budget has already been the binding constraint), and local-model members serialize
        behind `GpuScheduler`, so show that instead of implying parallelism
      - hosted members follow their own backend sandboxes and approval rules unchanged; no member can see another's
        workspace
      - owner-only; guests cannot start groups; members count each session against their session caps and disk quota

      Out of scope for v1: hunk-level merging across members (Orca has a 3-pane hunk picker), automatic judging by
      a model, and cross-machine groups.

      **Verify before designing.** The Orca research behind this item read only Orca's docs, release notes and
      directory listings, not its source (study: `docs/orca-study.md` tracked in #169, not yet
      merged). Any research or worker task must first clone `stablyai/orca` at a pinned commit (record the SHA), read
      the files below, and confirm or correct the claims in this issue. Paths not yet located are marked; find them by
      searching, do not guess. Do not copy Orca code; reimplement and credit.
      - `src/cli`: the `orca worktree` commands, including the fan-out spawn (`worktree fan` per a third-party review; unconfirmed)
      - `src/renderer`: the multi-agent compare and merge UI, described as a 3-pane hunk picker by a third-party review; unconfirmed
      - `docs/reference`: the worktree scan fingerprint and malformed worktree registration docs (titles only so far)

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: github-issue-to-task
    kind: feature
    title: "New task from a GitHub issue or PR on a project's repository"
    body: |
      Idea from the Orca comparison (`docs/orca-study.md`): Orca browses GitHub (and Linear) issues and PRs
      inside the app and starts a worktree from one. This backlog itself is mirrored to GitHub issues and the owner
      launches most work from them, so the round trip through the phone is the friction.

      Proposed shape:
      - for a project with a GitHub `repo`, New task offers **From issue / PR**: a searchable list of open items
        (title, number, labels, author) fetched read-only
      - choosing one prefills the prompt with the title, body, linked review comments (for a PR) and the number, and
        pre-selects the project and base branch (the PR's head branch for a PR review task)
      - use the credentials the project already uses for private clones and pushes; never expose them to the
        agent or the API response, and never widen a member's access beyond their own GitHub authentication
      - issue and PR text is untrusted input: render as text, cap length, and label it as external content in the
        prompt so an issue body cannot masquerade as owner instructions
      - no writes back to GitHub in v1 (no comments, labels or closing); the branch push stays the existing
        Review action
      - degrade cleanly when the repo is local-only, the token is missing or GitHub is unreachable

      Linear is out of scope. Related: private-repo push check, member GitHub authentication.

      **Verify before designing.** The Orca research behind this item read only Orca's docs, release notes and
      directory listings, not its source (study: `docs/orca-study.md` tracked in #169, not yet
      merged). Any research or worker task must first clone `stablyai/orca` at a pinned commit (record the SHA), read
      the files below, and confirm or correct the claims in this issue. Paths not yet located are marked; find them by
      searching, do not guess. Do not copy Orca code; reimplement and credit.
      - `src/main`: GitHub (and Linear) task provider code and how a task becomes a worktree (exact files not yet located)
      - `docs/reference`: the task provider identity validation doc (title only so far)
      - `skills/linear-tickets` and `skills/orca-linear`: how issue text reaches the agent

      **Readiness (2026-09-21): needs-refinement.** The shape above is clear, but it assumes credentials that do not
      exist. The daemon has no authenticated GitHub client today (`harness/web_tools.py` makes only unauthenticated
      fetches), and "the credentials the project already uses for private clones and pushes" are host Git credentials,
      not something the REST API can be assumed to accept. Member GitHub authentication (#63) is itself unrefined.

      Open decisions (recommended default first):
      1. **How the daemon reads issues and PRs.** Default: an owner-managed, read-only fine-grained token in an
         owner-only file, used server-side and never returned. Alternatives: the host's `gh` login, or reusing the Git
         credential helper (rejected: a Git credential is not an API token and would be widened silently).
      2. **Who can use it.** Default: owner-only in v1; members wait for #63.
      3. **Prompt framing.** The exact wrapper that marks issue and PR text as external content, plus size caps.
      4. **PR tasks.** Default: same-repo head branches only; refuse forks in v1.
      5. **Rate limits and caching** for the searchable list.

      Acceptance once decided: no credential appears in any API response, log or prompt; issue text cannot be
      confused with owner instructions (test with an issue body that imitates a system message); degrades cleanly
      when the token is missing or GitHub is unreachable.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: generic-cli-backend
    kind: feature
    title: "Config-declared backend adapter for additional agent CLIs (start with OpenCode)"
    body: |
      Idea from the Orca comparison (`docs/orca-study.md`): Orca reaches 30+ agents by treating any terminal agent
      as a launchable command with a thin status integration. The harness has three bespoke CLI backends (claude,
      codex, cursor). Adding a fourth should be configuration plus one small parser, not a new code path.

      Proposed shape:
      - a `backends:` entry can declare `kind: cli` with image, pinned version, command template for print/headless
        mode, auth volume and network, egress proxy allowlist, model/effort flags, and an output parser
        (`text` or `jsonl` with a documented event mapping)
      - runs in the same provider-only Docker sandbox and egress network as the existing CLIs; workspace-only
        mount; branch review afterwards
      - approvals: map the CLI's permission prompts when it exposes them; when it cannot ask, run only in
        auto-approve mode inside the sandbox (the Cursor `--force` pattern) and say so on the backend card
      - Settings → Backends shows model/effort, login state and usage where the CLI offers it, and says plainly
        when usage is unknown
      - API keys stay in owner-managed files and are never returned
      - repeat the provider-policy review (terms, billing, whether a subscription login may be driven headlessly)
        before enabling any provider, as was done for the existing three; do not ship a provider that fails it
      - `reference/opencode` already pins OpenCode for the bake-off and is the natural first adapter; a second CLI
        (for example Gemini CLI) proves the config is generic

      Must not weaken the per-app provider allowlist: a new backend is invisible to apps until the owner grants it.
      Related: #27 (SDK/OpenAPI across providers), #66 (typed settings registry: adapters are installer/file-only
      because they name images and secrets).

      **Verify before designing.** The Orca research behind this item read only Orca's docs, release notes and
      directory listings, not its source (study: `docs/orca-study.md` tracked in #169, not yet
      merged). Any research or worker task must first clone `stablyai/orca` at a pinned commit (record the SHA), read
      the files below, and confirm or correct the claims in this issue. Paths not yet located are marked; find them by
      searching, do not guess. Do not copy Orca code; reimplement and credit.
      - `src/main`: the managed agent-hook integration and per-agent launch definitions (exact files not yet located)
      - `docs/reference`: the agent status store and agent skill provider paths docs (titles only so far)
      - Orca issues #15110, #16286, #14938 and #16771: what breaks when many CLIs are wrapped and when hooks are rewritten externally

      **Readiness (2026-09-21): needs-refinement.** The three existing backends are separate protocol classes in
      `harness/cli_backends.py` (Claude stream-json, Codex app-server over stdio, Cursor print mode), so "configuration
      plus one small parser" only holds for one-shot print-mode CLIs. The provider-policy gate can also only be
      answered by an owner decision.

      Open decisions (recommended default first):
      1. **Scope of `kind: cli`.** Default: headless print-mode CLIs with `text` or `jsonl` output only; no
         interactive permission protocol. Anything needing a live approval channel stays a bespoke backend.
      2. **What OpenCode talks to.** Which provider or endpoint, and whether by API key (owner-managed file) or
         another auth mode. This sets the egress allowlist and the policy review. Do not enable a provider that has
         not passed the review recorded in the docs.
      3. **Image build and pinning.** A new CLI needs an image; the existing `sandbox/cli.Dockerfile` and its CI
         build cover only the current CLIs. Decide who builds and pins the version.
      4. **Approvals.** Confirm auto-approve inside the sandbox (the Cursor `--force` pattern) is acceptable for a CLI
         that cannot ask, and how the backend card states it.
      5. **Second CLI.** Whether Gemini CLI is a v1 acceptance criterion or a follow-up.

      Acceptance once decided: an adapter is invisible to apps until the owner grants it (per-app allowlist unchanged),
      a parser test per output mode with recorded fixtures, and adapters remain installer/file-only configuration.

      Do not put real paths, logins, tokens, or tailnet names in public comments.

  - key: orca-study-docs
