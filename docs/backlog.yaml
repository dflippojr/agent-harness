    body: |
      `docs/orca-study.md` compares Agent Harness with Orca (stablyai/orca, MIT), maps its design onto in-flight work
      (native client pairing, version skew, Chat, skills and the catalog, approvals, usage, worktree lifecycle), and
      lists what to read next. Issues #165-#168 were filed from it and point at it, so it must reach `main` first.

