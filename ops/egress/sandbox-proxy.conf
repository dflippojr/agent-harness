# Sandbox egress proxy policy (#671; harness/egress_proxy.py). Owner-reviewed: change it only by a PR the owner
# reviews. Nothing changes it per session, per App or at runtime, and no API exposes it.
#
# The proxy forwards only to public unicast addresses (`is_global`, not multicast, checked again on the IPv4 address
# inside IPv4-mapped, NAT64, SIIT, IPv4-compatible and 6to4 forms). That floor is built in; this file can only deny
# more. Every address a name resolves to must pass, and the proxy connects to the address it checked.
Listen 0.0.0.0
Port 8888
ConnectTimeout 10
IdleTimeout 600
MaxClients 64

# CONNECT (HTTPS, pip, npm, git over https) and plain http:// requests. Everything else, SSH git included, is refused.
ConnectPort 443
HttpPort 80

# The host, the LAN and the tailnet, listed explicitly on top of the public-only floor.
Deny 0.0.0.0/8           # "this network", unspecified
Deny 127.0.0.0/8         # loopback
Deny 10.0.0.0/8          # RFC 1918
Deny 172.16.0.0/12       # RFC 1918; Docker bridges and the host gateway
Deny 192.168.0.0/16      # RFC 1918; Docker Desktop's host.docker.internal
Deny 100.64.0.0/10       # shared address space; the tailnet
Deny 169.254.0.0/16      # link-local, cloud metadata
Deny 192.0.0.0/24        # IETF protocol assignments
Deny 192.0.2.0/24        # documentation
Deny 198.18.0.0/15       # benchmarking
Deny 198.51.100.0/24     # documentation
Deny 203.0.113.0/24      # documentation
Deny 224.0.0.0/4         # multicast
Deny 240.0.0.0/4         # reserved, and 255.255.255.255 broadcast
Deny ::/128              # unspecified
Deny ::1/128             # loopback
Deny fc00::/7            # unique local, which covers the tailnet's IPv6 range
Deny fe80::/10           # link-local
Deny fec0::/10           # deprecated site-local
Deny ff00::/8            # multicast
Deny 2001:db8::/32       # documentation
Deny 64:ff9b:1::/48      # local-use NAT64
