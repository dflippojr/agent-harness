# HTTPS-only forward proxy that allows CONNECT to the domains in /etc/tinyproxy/filter (mounted per backend) and
# denies everything else. Logs every request so the allowlists can be checked against what the CLIs really use.
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
LogLevel Info
Syslog Off
# only the backend sandbox network reaches this port; Docker keeps it off the host
Allow 0.0.0.0/0
ConnectPort 443
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs No
FilterCaseSensitive No
DisableViaHeader Yes
