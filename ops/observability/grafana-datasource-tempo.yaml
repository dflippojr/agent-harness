# Grafana provisioning: drop into the stack's grafana/provisioning/datasources/ directory. See README.md.
# `prometheus` below must be the uid of the existing Prometheus datasource that scrapes the harness
# (job agent_harness); change it if the stack uses another uid.
apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      search:
        hide: false
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        queries:
          - name: GPU slot busy
            query: max(harness_gpu_slot_busy)
          - name: Approval wait (rate)
            query: sum(rate(harness_approval_wait_seconds_total[5m]))
          - name: Event-loop stalls
            query: sum(rate(harness_event_loop_stall_seconds_count[5m]))
