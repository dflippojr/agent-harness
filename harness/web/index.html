<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Harness">
  <title>Agent Harness Web</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css?v=4">
  <script>
    try {
      const theme = localStorage.getItem("harness.theme");
      if (theme && theme !== "auto") document.documentElement.dataset.theme = theme;
      const hues = JSON.parse(localStorage.getItem("harness.themeHues") || "null");
      if (hues && theme === "custom") {
        if (hues.bg) document.documentElement.style.setProperty("--bg", hues.bg);
        if (hues.panel) document.documentElement.style.setProperty("--panel", hues.panel);
        if (hues.accent) document.documentElement.style.setProperty("--accent", hues.accent);
      }
      const sizes = { s: "0.875", m: "1", l: "1.125", xl: "1.25" };
      const size = localStorage.getItem("harness.textSize");
      if (size && sizes[size]) document.documentElement.style.setProperty("--text-scale", sizes[size]);
    } catch (e) { /* private mode */ }
  </script>
</head>
<body>
  <header id="bar">
    <button id="menu-btn" class="icon" type="button" aria-label="Open navigation menu" aria-haspopup="dialog"
            aria-controls="nav-drawer" aria-expanded="false">☰</button>
    <button id="back" class="icon" aria-label="Back" hidden>‹</button>
    <select id="feature-nav" aria-label="Feature" hidden>
      <option value="chat">Chat</option>
      <option value="agents">Agents</option>
      <option value="jobs">Tasks</option>
      <option value="images">Images</option>
    </select>
    <h1 id="title" hidden></h1>
    <a id="profile-icon" class="icon profile-icon" href="#/profile" aria-label="Agent Harness Web profile" hidden>🙂</a>
    <span id="conn" class="conn" title="Agent Harness Server live connection"></span>
  </header>
  <div id="drawer-scrim" hidden></div>
  <nav id="nav-drawer" aria-label="Main navigation" role="dialog" aria-modal="true" hidden>
    <div class="drawer-links">
      <a href="#/chat" data-nav="chat">Chat</a>
      <a href="#/agents" data-nav="agents">Agents</a>
      <a href="#/jobs" data-nav="jobs">Tasks</a>
      <a href="#/images" data-nav="images">Images</a>
      <a href="#/actions" data-nav="actions">Actions</a>
    </div>
    <div class="drawer-recent" aria-label="Recent chats">
      <h2>Recent chats</h2>
      <div id="drawer-chats"></div>
    </div>
    <div class="drawer-foot">
      <a id="drawer-profile" href="#/profile" data-nav="profile" aria-label="Agent Harness Web profile"><span id="drawer-profile-icon">🙂</span> Profile</a>
    </div>
  </nav>
  <div id="guest-banner" hidden role="status"></div>
  <main id="app"></main>
  <div id="fab-host" hidden>
    <a id="fab" class="btn new-task fab" href="#/new">+ New task</a>
  </div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/app.js?v=4"></script>
</body>
</html>
