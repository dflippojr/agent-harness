<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agents">
  <title>Agents</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    try {
      const theme = localStorage.getItem("harness.theme");
      if (theme && theme !== "auto") document.documentElement.dataset.theme = theme;
      const hues = JSON.parse(localStorage.getItem("harness.themeHues") || "null");
      if (hues && theme === "custom") {
        if (hues.bg) document.documentElement.style.setProperty("--bg", hues.bg);
        if (hues.panel) document.documentElement.style.setProperty("--panel", hues.panel);
        if (hues.accent) document.documentElement.style.setProperty("--accent", hues.accent);
      }
      const sizes = { s: "0.875", m: "1", l: "1.125", xl: "1.25" };
      const size = localStorage.getItem("harness.textSize");
      if (size && sizes[size]) document.documentElement.style.setProperty("--text-scale", sizes[size]);
    } catch (e) { /* private mode */ }
  </script>
</head>
<body>
  <header id="bar">
    <a id="profile-icon" class="icon profile-icon" href="#/profile" aria-label="Profile">🙂</a>
    <button id="back" class="icon" aria-label="Back" hidden>‹</button>
    <select id="feature-nav" aria-label="Feature">
      <option value="agents">Agents</option>
      <option value="jobs">Scheduled jobs</option>
      <option value="images">Image generation</option>
    </select>
    <h1 id="title" hidden></h1>
    <span id="conn" class="conn" title="Live connection"></span>
  </header>
  <div id="guest-banner" hidden role="status"></div>
  <main id="app"></main>
  <div id="fab-host" hidden>
    <a id="fab" class="btn new-task fab" href="#/new">+ New task</a>
  </div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
