# Harness daemon settings. Paths use forward slashes; they work on Windows.
# The installer keeps the selected full/service profile and module switches in profile.yaml. Keeping that small
# overlay separate makes profile changes reversible without rewriting the machine-specific settings below.
listen:
  host: 127.0.0.1        # published on the tailnet by `tailscale serve` (ops/tailscale/serve.ps1); never bind wider
  port: 8100

# Set these two in config/harness.local.yaml (untracked), which is merged over this file.
# The phone reaches the daemon here. Used for notification links and to check the Origin of browser requests.
public_url: ""          # e.g. https://tower.your-tailnet.ts.net
# Requests arriving through `tailscale serve` carry the caller's login; anyone else is refused.
allowed_logins: []      # e.g. [you@example.com]
# Time-boxed read-only Control Center access for a tailnet buddy. Put this in harness.local.yaml.
# Requires allowed_logins (otherwise every tailnet login is already owner). Restart after changing.
# until is ISO-8601 (timezone preferred). Omit until to last until you remove the entry.
guests: []
# guests:
#   - login: buddy@example.com
#     until: "2026-09-16T22:00:00-04:00"

notify:
  enabled: true
  server: http://127.0.0.1:8095                  # ntfy container (D:/Docker/ntfy), published at :8443 on the tailnet
  topic: agent-harness
  token_file: D:/Docker/ntfy/secrets/harness-publisher.token

data_dir: D:/Agents/harness   # SQLite DB, per-session workspaces, transcripts
repos_dir: D:/Agents/repos    # git_clone "local:<name>" clones from here (host-side, no network)

default_model: qwen3.6-35b-a3b
models:
  qwen3.6-35b-a3b:
    base_url: http://127.0.0.1:8090   # always-on server (ops/llama-server/run-qwen.ps1)
    context_tokens: 65536
    max_tokens: 8192                  # Qwen can think for 600+ tokens before answering
    sampling: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0.0}

sandbox:
  image: agent-harness-sandbox:py312
  memory: 2g
  cpus: "2"
  pids: 512
  network: harness-sandbox        # internal: no route out, no container-to-container traffic
  egress_network: harness-egress  # attached only while an approved network command runs

# Hosted CLI session backends (Phase 8a). Credentials remain in provider Docker volumes and are never read by the
# daemon. Run `ops/backends/login.ps1 <backend>` yourself before enabling one.
backends:
  claude:
    enabled: true
    image: agent-harness-cli:1
    model: claude-opus-5
    effort: high
    permission_mode: default
    max_sessions: 2
    billing: subscription
    auth: subscription
    proxy: http://harness-egress-claude:8888
    volume: harness-auth-claude
    network: harness-cli-claude
  codex:
    enabled: true
    image: agent-harness-cli:1
    model: gpt-5.6-sol
    effort: high
    permission_mode: on-request
    max_sessions: 2
    billing: subscription
    auth: subscription
    proxy: http://harness-egress-codex:8888
    volume: harness-auth-codex
    network: harness-cli-codex
    api_key_file: D:/Agents/harness/secrets/codex-api-key
  cursor:
    enabled: true
    image: agent-harness-cli:1
    model: cursor-grok-4.6-high
    effort: high
    permission_mode: force
    max_sessions: 2
    billing: subscription
    auth: subscription
    proxy: http://harness-egress-cursor:8888
    volume: harness-auth-cursor
    network: harness-cli-cursor
    api_key_file: D:/Agents/harness/secrets/cursor-api-key

# Homelab tools for projects with `homelab: true` (harness/homelab.py). The daemon runs these on the host;
# agents only name a service from this allowlist. Restarts always need approval.
homelab:
  docker_root: D:/Docker
  prometheus_url: http://127.0.0.1:9090   # 127.0.0.1, not localhost: wslrelay holds ::1:9090
  services:                               # name = container_name = compose service unless overridden
    plex-webhook: {stack: plex-webhook}
    prometheus: {stack: observability-stack}
    grafana: {stack: observability-stack}
    cadvisor: {stack: observability-stack}
    ntfy: {stack: ntfy}
    harness-demo: {stack: harness-demo}   # disposable service for exercising the restart flow

# Machines that run tool calls for projects with `target: <name>` (harness/remote.py). The model stays here; the
# runner (macrunner/, installed with ops/macbook/deploy.ps1) connects out to this daemon and authenticates with
# the token in token_file. Its sandbox and allowed project directories are set on the runner itself.
runners:
  macbook:
    token_file: D:/Agents/harness/secrets/runner-macbook.token
    min_free_gb: 10          # the Mac's disk is nearly full; refuse new workspaces below this
    workspace_quota_mb: 3000

# Sandbox cleanup and disk quotas (harness/maintenance.py).
cleanup:
  interval_minutes: 60
  container_idle_hours: 24
  workspace_retention_days: 14
  workspace_quota_mb: 5000
  min_free_gb: 20

# Per run (one user message and the agent work it triggers). Hitting one ends the run; send a message to continue.
budgets:
  max_turns: 80
  max_completion_tokens: 200000

compaction:
  elide_at: 0.55       # fraction of context_tokens: shorten old tool outputs
  summarize_at: 0.65   # still above this after eliding: summarize older turns
  keep_recent: 0.20    # fraction of context kept verbatim after a summary

# GPU contention guard (harness/gpu_guard.py). While a game runs (Steam/Epic/GOG/Xbox library folders, or Sunshine's
# Steam Big Picture app) or Plex hardware-transcodes, the queue pauses after the current model turn, llama-server is
# stopped, and it's restarted once the GPU has been clear for resume_after_seconds. Desktop streaming alone is fine.
gpu_guard:
  enabled: true
  poll_seconds: 10
  resume_after_seconds: 180
  drain_timeout_seconds: 300
  pause_flag: C:/AI/llama-server.paused   # also in ops/llama-server/run-qwen.ps1

# Nightly online copy of the session database, transcripts, and project config (harness/maintenance.py).
# Also on demand: POST /maintenance/backup.
backup:
  enabled: true
  dir: D:/My Backups/agent-harness
  at: "03:30"
  keep_days: 14

# Memory library for agents (harness/memory_library.py). The daemon keeps its own clone and pulls it at most every
# refresh_minutes. Only these categories are visible; sensitive ones (health, emotions, feelings, finance,
# relationships, identity) and the top-level index, inbox, and cross-category capsules are not.
# writes: agents propose changes (memory_edit / memory_write) in the visible categories and the profile; every one
# needs approval with the diff (user decision, Phase 7b), then the clone commits and pushes.
# profile_path: a short curated file put in every new session's system prompt once (Phase 7c).
# Projects can opt out with `memory_library: false`. Set repo in harness.local.yaml.
memory_library:
  enabled: true
  repo: ""
  clone_dir: D:/Agents/memory-library
  refresh_minutes: 10
  categories: [project-ideas, work, home-and-pets, sport, taste-and-media, communication-preferences]
  writes: true
  profile_path: agent-profile.md
  profile_max_chars: 6000

# web_search / web_fetch for agents (harness/web_tools.py), run by the daemon without approval (user decision,
# Phase 6b). Fetches refuse non-public addresses (loopback, private, CGNAT/tailnet, link-local, metadata), re-check
# every redirect, and connect to the checked IP. SearXNG lives in D:/Docker/searxng. Projects opt out with `web: false`.
web:
  enabled: true
  searxng_url: http://127.0.0.1:8888
  page_chars: 15000
  max_bytes: 5242880
  timeout_seconds: 20
  # Final answers whose quotes don't appear in anything the agent read get one request to fix them, and any that
  # remain are flagged on the answer (harness/grounding.py). Applies to every session, not only web research.
  quote_check: true

# Full-text search over past sessions (harness/search.py): the app's search box, GET /search, and the agent tools
# session_search / session_read. The index lives in the session database. Projects opt out with `session_search: false`.
search:
  enabled: true

# Scheduled jobs (harness/jobs.py): recurring agent tasks on cron schedules (tower local time), managed in the app
# under Jobs. Each run is an ordinary session. Jobs end with STATUS: OK or ATTENTION; OK stays quiet or low-priority
# (per job), ATTENTION and failures notify normally (user decision, Phase 7d).
jobs:
  enabled: true
  poll_seconds: 30

# Claude Code Remote Control servers (harness/remote_control.py): Settings -> Claude Remote Control, the app API
# (/api/v1/remote-control, scope remote_control), and the agent tool open_claude_remote_control (always asks). Each
# server runs the unmodified `claude remote-control` in a tower project's folder; sessions opened from the Claude app
# get their own git worktree and ask for permission there. Folders must be trusted in Claude Code first (run `claude`
# there once). Default: every tower project with a local repo; list names under `projects` to limit those projects.
# `folders` adds local folders for Remote Control only; they never become sandboxed harness session projects.
remote_control:
  enabled: true
  spawn: worktree
  permission_mode: default
  capacity: 4
  folders:
    agent-harness: D:/Projects/agent-harness
    # The user's private working copy, not memory_library.clone_dir. Keep its remote private.
    agent-memory-library: ~/OneDrive/Documents/agent-memory-library

# OpenAI/Anthropic-compatible inference endpoint for other tools (harness/endpoint.py): /v1/chat/completions,
# /v1/completions, /v1/responses, /v1/messages, /v1/models, /v1/capabilities, and optionally /v1/embeddings.
# Per-device keys come from Settings or POST /keys.
# Requests go ahead of the next agent turn (user decision, Phase 6c); an agent turn that has waited agent_fair_seconds
# goes first. Refused with 503 while the GPU guard has the model unloaded.
endpoint:
  enabled: true
  model_aliases: {}          # e.g. {"claude-*": qwen3.6-35b-a3b}; unknown names use the default model anyway
  max_waiting: 4
  agent_fair_seconds: 90
  request_timeout_seconds: 1800
  # Embeddings require a separate llama-server started with --embedding and a dedicated embedding model.
  # Set both to advertise and enable /v1/embeddings; leaving either blank keeps the route unavailable.
  embedding_base_url: ""     # e.g. http://127.0.0.1:8091
  embedding_model: ""        # e.g. nomic-embed-text-v1.5
  embedding_context_tokens: 8192

# Local image generation with ComfyUI (harness/images.py). Jobs stop llama-server (same pause flag as the GPU guard)
# and start ComfyUI from C:/AI/ComfyUI. Opening the Images tab warms ComfyUI without loading a checkpoint; the GPU
# is given back as soon as the queue is empty.
# Models in C:/AI/comfy-models: fast = Z-Image-Turbo, quality = Qwen-Image-2512 (both Apache 2.0).
images:
  enabled: true
  comfy_dir: C:/AI/ComfyUI
  port: 8188
  work_dir: D:/Agents/harness/images-work
  linger_seconds: 0
