sonar.organization=dflippojr
sonar.projectKey=dflippojr_agent-harness
sonar.projectName=agent-harness
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=harness,sdk,scripts,macrunner,ops
sonar.tests=tests
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.worktrees/**,**/node_modules/**,third_party/**
sonar.test.exclusions=**/.venv/**
sonar.python.coverage.reportPaths=coverage.xml
# Python coverage comes from pytest-cov. Keep non-Python and example files out of
# the coverage metric so they cannot fail the quality gate as 0% uncovered.
sonar.coverage.exclusions=harness/web/**,ops/**,sdk/examples/**,**/*.ps1,**/*.html,**/*.css,**/*.js,**/*.mjs,**/*.json
