sonar.organization=dflippojr
sonar.projectKey=dflippojr_agent-harness
sonar.projectName=agent-harness
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
sonar.sources=harness,harness_modules,stables,sdk,scripts,macrunner,ops
# Stables' Node harnesses are tests, not sources (stables is a source root).
sonar.tests=tests,stables/tests
# Not analysed as sources: the generated stables/types/api.d.ts and openapi.json (npm run generate), and stables/tests.
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.worktrees/**,**/node_modules/**,third_party/**,stables/types/api.d.ts,stables/types/openapi.json,stables/tests/**
sonar.test.exclusions=**/.venv/**
sonar.python.coverage.reportPaths=coverage.xml
# Python coverage comes from pytest-cov. Keep non-Python and example files out of
# the coverage metric so they cannot fail the quality gate as 0% uncovered.
sonar.coverage.exclusions=stables/public/**,ops/**,sdk/examples/**,**/*.ps1,**/*.html,**/*.css,**/*.js,**/*.mjs,**/*.json
