version: 2
updates:
  - package-ecosystem: pip
    assignees:
      - dflippojr
    directories:
      - /
      - /tools/openapi
    schedule:
      interval: weekly
    groups:
      # One PR per dependency across both directories: tools/openapi pins fastapi
      # exactly, so raising the floor at / alone makes the openapi job's install fail.
      same-dependency:
        group-by: dependency-name

  - package-ecosystem: docker
    assignees:
      - dflippojr
    directories:
      # Dockerfile discovery also includes cli.Dockerfile.
      - /sandbox
      - /ops/egress
      - /reference/hermes
      - /reference/openclaw
      - /reference/opencode
      - /reference/openhands
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    assignees:
      - dflippojr
    # Discovers docker-compose.tempo.yml. ops/egress/compose.yaml only uses
    # the locally built agent-harness-egress image, so it has no update job.
    directory: /ops/observability
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    assignees:
      - dflippojr
    directory: /
    schedule:
      interval: weekly
