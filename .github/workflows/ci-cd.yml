name: CI and container images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: agent-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  SANDBOX_IMAGE: ghcr.io/${{ github.repository_owner }}/agent-harness-sandbox
  CLI_IMAGE: ghcr.io/${{ github.repository_owner }}/agent-harness-cli

jobs:
  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check browser bundle syntax
        run: node --check harness/web/app.js
      - name: Run tests
        run: python -m pytest tests -q

  publish-images:
    name: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish session sandbox
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: true
          tags: |
            ${{ env.SANDBOX_IMAGE }}:sha-${{ github.sha }}
            ${{ env.SANDBOX_IMAGE }}:py312
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
      - name: Build and publish subscription CLI sandbox
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/cli.Dockerfile
          push: true
          build-args: SANDBOX_IMAGE=${{ env.SANDBOX_IMAGE }}:sha-${{ github.sha }}
          tags: |
            ${{ env.CLI_IMAGE }}:sha-${{ github.sha }}
            ${{ env.CLI_IMAGE }}:1
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli
