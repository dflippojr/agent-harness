name: CI

# Feature-branch pushes without a PR do not run. `pull_request` covers open and
# later commits on a PR (`synchronize`); `push` to main still runs after merge.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pytest pool (`agent-harness-ci`, three tower members). SonarCloud is
    # GitHub-hosted (`sonar.yml`); review uses the `agent-harness-review`
    # pool; the tower runner is deploy only (`ci-cd.yml` `deploy-tower`).
    runs-on: [self-hosted, Windows, X64, agent-harness-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up virtualenv
        shell: powershell
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt

      - name: Run test suite
        shell: powershell
        run: .venv\Scripts\python -m pytest tests -q
