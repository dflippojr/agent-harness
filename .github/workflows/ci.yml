name: CI

# One workflow, all GitHub-hosted (free for this public repo):
#   openapi   - the committed OpenAPI document (tools/openapi/openapi.json) matches the Server
#   test      - the complete pytest suite with coverage (coverage.xml artifact)
#   sonar     - SonarCloud analysis of that coverage, with the quality-gate wait
#   ui-tests  - Playwright journeys of the pinned Stables release (tools/stables/pin.json) against a fake-model Server
#   changes   - lists the changed files; the three test jobs skip when every one is on the skip list
#   gate      - the one check to require: always runs, fails if any job it needs failed or was cancelled
# The suite runs once. Tests used to run a second time on a self-hosted
# `agent-harness-ci` pool on the tower; that pool is retired so CI no longer
# competes with llama-server and the desktop for RAM. The job ids `test` and
# `sonar` keep the check names they had before the merge.
#
# Feature-branch pushes without a PR do not run. `pull_request` covers open and
# later commits on a PR (`synchronize`); `push` to main still runs after merge.
#
# The workflow always runs, so `gate` always reports and a ruleset can require it
# (#726, dflippojr/agent-ops#48). The docs-only skip lives in the `changes` job:
# CI_SKIP_UNREAD_PATHS is an allow-list of files no pytest currently reads, and
# `test`, `openapi` and `ui-tests` skip only when every changed file is on it.
# Entries are exact paths, not globs. Do not add `**.md` or `docs/**`: README.md and docs/web.md, control-center.md,
# INSTALL.md, admin-api.md, app-api.md, mac-client.md, and service-profile.md
# are asserted by tests/test_product_naming.py; marketplace design, threat
# model, schema, and example manifests by tests/test_marketplace_manifest.py;
# docs/CI-CD.md by
# tests/test_review_runner.py::test_ci_docs_explain_backend_configuration_and_manual_verification.
# Adding a test that reads a skipped file requires removing that path from
# the list in the same change. None of the skipped files are Sonar
# sources, so skipping the analysis with them loses nothing.
#
# `gate` passes when the test jobs were skipped by `changes`, so a docs-only PR
# is not left pending. .github/workflows/ci-cd.yml publishes and deploys only
# when `test` itself ran and passed for the commit that is still main's tip, so
# a docs-only push or a superseded commit never publishes or deploys (desired).
# On a push to main the `sonar` job is continue-on-error and `gate` ignores it:
# a failing quality gate shows on the job but blocks neither the gate nor the
# deploy (#728 changes that); only failing tests do. On pull requests the
# quality gate still fails `sonar`, and with it `gate`.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A PR push cancels that PR's older run. Each main push gets a group of its own commit, so no main run is
  # cancelled, nor replaced while pending (GitHub drops a pending run when a newer one queues in the same group,
  # even with cancel-in-progress false). Every merge commit is tested on its own; batch merges used to cancel most.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    # The suite is Windows-native (CreateProcess flags, msvcrt, PowerShell), so
    # it runs on windows-latest; Ubuntu fails on msvcrt, console-creation flags,
    # and Windows paths. Docker-image and GPU tests skip on the hosted runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-repomap.txt -r requirements-telemetry.txt pytest-cov pytest-xdist

      # Docs fragments (#498): PRs add docs/fragments/*.yaml and never edit a generated region. On a PR the region
      # may match the base branch's fragments or this branch's; on main it must match main's own fragments.
      - name: Check docs fragments
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch --depth=1 origin "${{ github.base_ref }}"
            if ($LASTEXITCODE -ne 0) { throw "git fetch of the PR base failed" }
            python scripts/docs/build.py --check --base FETCH_HEAD
          } else {
            # On main the docs-regen workflow rewrites regions after a merge, so only the fragments are validated.
            python scripts/docs/build.py --check --fragments-only
          }

      # pytest-cov and pytest-xdist are CI extras (not in requirements.txt).
      # Fixed -n 4 --dist loadfile: hosted windows-latest has 4 vCPUs; do not
      # use pytest's auto worker count. NUMBER_OF_PROCESSORS is logged so run
      # logs can verify the 4-vCPU assumption. pytest-cov merges worker data
      # into coverage.xml. COVERAGE_CORE sysmon is not set: .coveragerc enables
      # branch coverage, and sysmon cannot measure branches on Python 3.12
      # (branch sysmon needs 3.14+).
      # Serial escape hatch locally: python -m pytest tests -q -p no:xdist
      - name: Confirm hosted runner cores
        shell: powershell
        run: Write-Host "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"

      - name: Run tests with coverage
        # A hung test fails the step after 40 minutes with its log saved, and faulthandler prints the stack of any
        # test that runs longer than 5 minutes (that is how the Python 3.12 subprocess hang on #228 was found).
        timeout-minutes: 40
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: >
          python -m pytest tests -q -n 4 --dist loadfile -o faulthandler_timeout=300
          --cov=harness --cov=harness_modules --cov=sdk --cov=scripts --cov=macrunner
          --cov-report=xml:coverage.xml --cov-report=term --cov-fail-under=88

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 3

  sonar:
    # SonarCloud analysis of the `test` job's coverage. Automatic analysis is
    # turned off in SonarCloud; this job is the analysis. Same windows-latest
    # image as `test`, so the absolute <source> paths in coverage.xml resolve.
    needs: test
    runs-on: windows-latest
    # Forks have no secrets. Same-repository Dependabot PRs use the separate
    # Dependabot secret store; they run the same scan when its token is set.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - name: Check SonarCloud token availability
        id: sonar-token
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($env:DEPENDABOT_PR -eq 'true') {
            'available=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host '::notice::SonarCloud analysis was not performed: add repository Dependabot secret SONARCLOUD_TOKEN, then rerun this PR workflow.'
            'SonarCloud analysis was not performed because the repository Dependabot secret SONARCLOUD_TOKEN is unavailable. Add that secret and rerun this PR workflow to publish analysis.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            throw 'SONARCLOUD_TOKEN is required for SonarCloud analysis.'
          }

      - uses: actions/checkout@v7
        if: steps.sonar-token.outputs.available == 'true'
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - name: Download coverage
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Scan with SonarCloud
        if: steps.sonar-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

  openapi:
    # Clients pin this document: Stables (dflippojr/stables) copies it into types/openapi.json and type-checks
    # against the copy, so a route or model change shows up here as a diff to the committed document.
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install schema dependencies
        run: python -m pip install -r requirements.txt -r tools/openapi/requirements.txt
      - name: Verify the committed OpenAPI document
        run: python tools/openapi/export_schema.py --check

  ui-tests:
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure disposable instance path
        run: |
          "HARNESS_UI_INSTANCE_DIR=$env:RUNNER_TEMP/harness-ui-tests" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Stables lives in the private dflippojr/stables (#334). STABLES_DEPLOY_KEY is a read-only deploy key there; it is
      # in the Actions and Dependabot secret stores. Forks have neither, so their PRs stop here with this message.
      - name: Read the Stables pin
        id: stables
        env:
          STABLES_DEPLOY_KEY: ${{ secrets.STABLES_DEPLOY_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STABLES_DEPLOY_KEY)) {
            throw 'STABLES_DEPLOY_KEY is required to check out the pinned Stables release (dflippojr/stables).'
          }
          $pin = Get-Content -Raw tools/stables/pin.json | ConvertFrom-Json
          "repository=$($pin.repository)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "tag=$($pin.tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append
          "HARNESS_STABLES_DIR=$env:GITHUB_WORKSPACE\stables-release\public" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Check out the pinned Stables release
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.stables.outputs.repository }}
          ref: refs/tags/${{ steps.stables.outputs.tag }}
          path: stables-release
          ssh-key: ${{ secrets.STABLES_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/ui-tests/package-lock.json
      - name: Install UI test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm --prefix tools/ui-tests ci
          npm --prefix tools/ui-tests exec -- playwright install chromium webkit
      - name: The pinned commit and API call list match the Stables checkout
        run: python tools/stables/pin.py --check stables-release
      - name: Run disposable fake-model UI journeys
        run: npm --prefix tools/ui-tests test -- --workers=1
      - name: Redact traces and stop the disposable instance
        id: cleanup
        if: always()
        run: |
          if (Test-Path tools/ui-tests/node_modules/fflate) {
            node tools/ui-tests/cleanup.mjs
          } else {
            python -m harness.fake_instance stop --dir "$env:HARNESS_UI_INSTANCE_DIR"
          }
      - name: Upload sanitized UI evidence
        if: always() && steps.cleanup.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-evidence
          path: |
            tools/ui-tests/playwright-report/
            tools/ui-tests/test-results/
          if-no-files-found: ignore
          retention-days: 7

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and its base parent (or the pushed commit); trees only, plus the one script.
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: scripts/ci_gate.py
          sparse-checkout-cone-mode: false
      - name: Decide whether any changed file is read by the tests
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          CI_SKIP_UNREAD_PATHS: |
            LICENSE
            third_party/Real-ESRGAN.LICENSE
            docs/compatibility.md
            docs/flux-fast.md
            docs/issue-13-lightning-results.md
            docs/smart-approvals.md
            docs/phase0-results.md
            docs/phase1-results.md
            docs/phase2-results.md
            docs/phase3-results.md
            docs/phase4-results.md
            docs/phase5-results.md
            docs/phase6a-hermes-study.md
            docs/phase6b-results.md
            docs/phase6c-results.md
            docs/phase6d-results.md
            docs/phase6e-results.md
            docs/phase7a-results.md
            docs/phase7b-results.md
            docs/phase7d-results.md
            docs/phase7e-results.md
            docs/phase8a-design.md
            docs/phase8b-results.md
            docs/phase8c-results.md
        run: python3 scripts/ci_gate.py changes

  gate:
    # The required check. It always runs and needs every job above, so it reports on docs-only changes too
    # (`test`, `openapi` and `ui-tests` skipped by `changes`). Any needed job failed or cancelled fails it; see
    # scripts/ci_gate.py for the rules. Add every new job here.
    if: always()
    needs: [changes, test, sonar, openapi, ui-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci_gate.py
          sparse-checkout-cone-mode: false
      - name: Every needed job passed, or was skipped on purpose
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/ci_gate.py gate
