name: CI

# One workflow, three jobs, all GitHub-hosted (free for this public repo):
#   web-types - generated OpenAPI freshness and native JavaScript type checking
#   test  - the complete pytest suite with coverage (coverage.xml artifact)
#   sonar - SonarCloud analysis of that coverage, with the quality-gate wait
# The suite runs once. Tests used to run a second time on a self-hosted
# `agent-harness-ci` pool on the tower; that pool is retired so CI no longer
# competes with llama-server and the desktop for RAM. The job ids `test` and
# `sonar` keep the check names they had before the merge.
#
# Feature-branch pushes without a PR do not run. `pull_request` covers open and
# later commits on a PR (`synchronize`); `push` to main still runs after merge.
#
# paths-ignore is an allow-list of files no pytest currently reads. GitHub
# skips this workflow only when every changed file matches the list. Do not
# use `**.md` or `docs/**`: README.md and docs/web.md, control-center.md,
# INSTALL.md, admin-api.md, app-api.md, mac-client.md, and service-profile.md
# are asserted by tests/test_product_naming.py; marketplace design, threat
# model, schema, and example manifests by tests/test_marketplace_manifest.py;
# docs/CI-CD.md by
# tests/test_review_runner.py::test_ci_docs_explain_backend_configuration_and_manual_verification.
# Adding a test that reads a skipped file requires removing that path from
# paths-ignore in the same change. None of the skipped files are Sonar
# sources, so skipping the analysis with them loses nothing.
#
# main currently has no branch protection or rulesets, so a skipped `test`
# check is acceptable. If `test` ever becomes required, add a tiny
# always-running success job (do not add that job here).
# .github/workflows/ci-cd.yml already deploys only when
# workflow_run.conclusion == 'success' for a push to main, so a skipped or
# absent CI run does not publish or deploy (desired). On a push to main the
# `sonar` job is continue-on-error: a failing quality gate shows on the job
# but does not block the deploy; only failing tests do. On pull requests the
# quality gate still fails the check.
on:
  push:
    branches: [main]
    paths-ignore: &ci-skip-unread-paths
      - LICENSE
      - third_party/Real-ESRGAN.LICENSE
      - docs/compatibility.md
      - docs/config-registry.md
      - docs/flux-fast.md
      - docs/issue-13-lightning-results.md
      - docs/smart-approvals.md
      - docs/phase0-results.md
      - docs/phase1-results.md
      - docs/phase2-results.md
      - docs/phase3-results.md
      - docs/phase4-results.md
      - docs/phase5-results.md
      - docs/phase6a-hermes-study.md
      - docs/phase6b-results.md
      - docs/phase6c-results.md
      - docs/phase6d-results.md
      - docs/phase6e-results.md
      - docs/phase7a-results.md
      - docs/phase7b-results.md
      - docs/phase7d-results.md
      - docs/phase7e-results.md
      - docs/phase8a-design.md
      - docs/phase8b-results.md
      - docs/phase8c-results.md
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: *ci-skip-unread-paths

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-types:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/web-types/package-lock.json
      - name: Install schema and type-check dependencies
        run: |
          python -m pip install -r requirements.txt -r tools/web-types/requirements.txt
          npm --prefix tools/web-types ci
      - name: Verify generated API contract and check native JavaScript
        run: npm --prefix tools/web-types run check

  test:
    # The suite is Windows-native (CreateProcess flags, msvcrt, PowerShell), so
    # it runs on windows-latest; Ubuntu fails on msvcrt, console-creation flags,
    # and Windows paths. Docker-image and GPU tests skip on the hosted runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-repomap.txt -r requirements-telemetry.txt pytest-cov pytest-xdist

      # Docs fragments (#498): PRs add docs/fragments/*.yaml and never edit a generated region. On a PR the region
      # may match the base branch's fragments or this branch's; on main it must match main's own fragments.
      - name: Check docs fragments
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            git fetch --depth=1 origin "${{ github.base_ref }}"
            if ($LASTEXITCODE -ne 0) { throw "git fetch of the PR base failed" }
            python scripts/docs/build.py --check --base FETCH_HEAD
          } else {
            # On main the docs-regen workflow rewrites regions after a merge, so only the fragments are validated.
            python scripts/docs/build.py --check --fragments-only
          }

      # pytest-cov and pytest-xdist are CI extras (not in requirements.txt).
      # Fixed -n 4 --dist loadfile: hosted windows-latest has 4 vCPUs; do not
      # use pytest's auto worker count. NUMBER_OF_PROCESSORS is logged so run
      # logs can verify the 4-vCPU assumption. pytest-cov merges worker data
      # into coverage.xml. COVERAGE_CORE sysmon is not set: .coveragerc enables
      # branch coverage, and sysmon cannot measure branches on Python 3.12
      # (branch sysmon needs 3.14+).
      # Serial escape hatch locally: python -m pytest tests -q -p no:xdist
      - name: Confirm hosted runner cores
        shell: powershell
        run: Write-Host "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"

      - name: Run tests with coverage
        # A hung test fails the step after 40 minutes with its log saved, and faulthandler prints the stack of any
        # test that runs longer than 5 minutes (that is how the Python 3.12 subprocess hang on #228 was found).
        timeout-minutes: 40
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: >
          python -m pytest tests -q -n 4 --dist loadfile -o faulthandler_timeout=300
          --cov=harness --cov=harness_modules --cov=sdk --cov=scripts --cov=macrunner
          --cov-report=xml:coverage.xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml
          retention-days: 3

  sonar:
    # SonarCloud analysis of the `test` job's coverage. Automatic analysis is
    # turned off in SonarCloud; this job is the analysis. Same windows-latest
    # image as `test`, so the absolute <source> paths in coverage.xml resolve.
    needs: test
    runs-on: windows-latest
    # Forks have no secrets. Same-repository Dependabot PRs use the separate
    # Dependabot secret store; they run the same scan when its token is set.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: ${{ github.event_name == 'push' }}
    steps:
      - name: Check SonarCloud token availability
        id: sonar-token
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          DEPENDABOT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($env:DEPENDABOT_PR -eq 'true') {
            'available=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host '::notice::SonarCloud analysis was not performed: add repository Dependabot secret SONARCLOUD_TOKEN, then rerun this PR workflow.'
            'SonarCloud analysis was not performed because the repository Dependabot secret SONARCLOUD_TOKEN is unavailable. Add that secret and rerun this PR workflow to publish analysis.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            throw 'SONARCLOUD_TOKEN is required for SonarCloud analysis.'
          }

      - uses: actions/checkout@v7
        if: steps.sonar-token.outputs.available == 'true'
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - name: Download coverage
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/download-artifact@v7
        with:
          name: coverage

      - name: Scan with SonarCloud
        if: steps.sonar-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
