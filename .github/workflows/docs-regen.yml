name: Docs regeneration

# Docs fragments (#499): after a merge to main, rewrite the generated regions from docs/fragments and commit the
# result to main. This workflow is the single writer. Pushes made with the default GITHUB_TOKEN never start other
# workflow runs, so the bot commit cannot re-trigger this workflow, CI, or (through CI) the tower
# deploy. The "[skip ci]" in its message makes that explicit for any future trigger that would not have that
# property. Merges that land close together share one concurrency group and produce one regeneration commit.
on:
  push:
    branches: [main]
    paths:
      - docs/fragments/**
      - scripts/docs/**
      - .github/workflows/docs-regen.yml
  workflow_dispatch:

concurrency:
  group: docs-regen
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Regenerate and push
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            python scripts/docs/build.py
            if git diff --quiet; then
              echo "Generated docs already up to date; no commit."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Docs: regenerate fragment regions [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (main moved); retrying from the new tip (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
