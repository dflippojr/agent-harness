name: Docs regeneration

# Docs fragments (#499): after a merge to main, rewrite the generated regions from docs/fragments and land the result
# on main through a pull request (#738). This workflow is the single writer. It never pushes to main: it force-pushes
# the regenerated tree to the bot branch below, opens (or reuses) a PR from it, runs CI on that branch, and squash-merges
# the PR only after CI passes, so the docs commit goes through the same gate as any other change (and a ruleset that
# requires a PR and the `gate` check on main never has to exempt it).
#
# Two GITHUB_TOKEN rules shape this:
# - A PR that GITHUB_TOKEN opens or updates starts no `pull_request` runs, so CI is started explicitly with
#   workflow_dispatch (the one event GITHUB_TOKEN may trigger). Its check runs land on the PR head commit, which is
#   what a required check reads. ci-cd.yml deploys only after a CI run for a push to main, so this run never deploys.
# - The merge, made with GITHUB_TOKEN, starts no workflow runs either, so the merged commit cannot re-trigger this
#   workflow, CI, or (through CI) the tower deploy. The "[skip ci]" in its message makes that explicit for any future
#   trigger that would not have that property.
# Creating the PR needs the repository setting "Allow GitHub Actions to create and approve pull requests".
# Merges that land close together share one concurrency group: a newer run cancels an older one, then force-pushes
# the branch and reuses its open PR, so a burst produces one docs PR.
on:
  push:
    branches: [main]
    paths:
      - docs/fragments/**
      - scripts/docs/**
      # Code-derived tables (#500): routes and settings live here.
      - harness/**
      - harness_modules/**
      - .github/workflows/docs-regen.yml
  workflow_dispatch:

concurrency:
  group: docs-regen
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    # CI on the docs branch takes about 25 minutes; the job waits for it before merging.
    timeout-minutes: 75
    permissions:
      # Push the bot branch and merge its PR.
      contents: write
      # Open, reuse and close the bot PR.
      pull-requests: write
      # Start CI on the bot branch (workflow_dispatch) and watch that run.
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      DOCS_BRANCH: bot/docs-regen
      COMMIT_SUBJECT: "Docs: regenerate fragment regions [skip ci]"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install generator dependencies (code tables import harness)
        run: python -m pip install -r requirements.txt
      - name: Regenerate onto the docs branch
        id: regen
        run: |
          set -euo pipefail
          python scripts/docs/build.py
          open_pr="$(gh pr list --head "$DOCS_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if git diff --quiet; then
            echo "Generated docs already up to date; no PR."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment "main already has these regions; closing the stale docs PR."
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$DOCS_BRANCH"
          git commit -am "$COMMIT_SUBJECT"
          git push --force origin "HEAD:refs/heads/$DOCS_BRANCH"
          if [ -z "$open_pr" ]; then
            if ! gh pr create --base main --head "$DOCS_BRANCH" --title "Docs: regenerate fragment regions" \
              --body "Regenerated by \`.github/workflows/docs-regen.yml\` from main at ${GITHUB_SHA}. It merges itself once CI passes on this branch (#738)."; then
              echo "::error::Could not open the docs PR. Enable Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."
              exit 1
            fi
            open_pr="$(gh pr list --head "$DOCS_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr=$open_pr" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run CI on the docs branch
        if: steps.regen.outputs.changed == 'true'
        id: ci
        env:
          HEAD_SHA: ${{ steps.regen.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$DOCS_BRANCH"
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --branch "$DOCS_BRANCH" --event workflow_dispatch --commit "$HEAD_SHA" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "CI did not start on $DOCS_BRANCH at $HEAD_SHA." >&2
            exit 1
          fi
          echo "Watching CI run $run_id."
          gh run watch "$run_id" --interval 30 --exit-status
      - name: Merge the docs PR
        if: steps.regen.outputs.changed == 'true'
        env:
          PR_NUMBER: ${{ steps.regen.outputs.pr }}
          HEAD_SHA: ${{ steps.regen.outputs.sha }}
        # --match-head-commit merges exactly the commit CI just passed; if the branch moved, the merge is refused.
        # The repository deletes the merged branch (delete_branch_on_merge), so the next run starts it fresh.
        # Under a ruleset, the merge also needs the required `gate` check. #726 adds that job to ci.yml, so the
        # dispatched CI run above produces it; agent-ops applies the ruleset only once `gate` is green on main.
        run: >
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
          --subject "$COMMIT_SUBJECT (#$PR_NUMBER)"
