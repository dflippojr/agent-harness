name: Docs regeneration

# Regenerated regions reach main through a PR from the dedicated, repository-scoped
# dflippojr-docs-regen App (#738). Its PR events run normal CI, including the required gate.
# The main ruleset also requires gate-guard-target / gate-guard, a separate pull_request_target
# workflow that can still be running when CI ends, so the merge waits for that check run too (#765).
# Auto-merge is not enabled on this repository, so the wait polls instead of using gh pr merge --auto.
# Only the squash commit carries [skip ci], preventing another CI/deploy or regeneration run.
on:
  push:
    branches: [main]
    paths:
      - docs/fragments/**
      - scripts/docs/**
      - harness/**
      - harness_modules/**
      - .github/workflows/docs-regen.yml
  workflow_dispatch:

concurrency:
  group: docs-regen
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Read workflow runs with the default token; the App has no Actions permission.
      GH_TOKEN: ${{ github.token }}
      DOCS_BRANCH: bot/docs-regen
      COMMIT_SUBJECT: "Docs: regenerate fragment regions"
      MERGE_SUBJECT: "Docs: regenerate fragment regions [skip ci]"
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.DOCS_REGEN_APP_ID }}
          private-key: ${{ secrets.DOCS_REGEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install generator dependencies (code tables import harness)
        run: python -m pip install -r requirements.txt
      - name: Regenerate onto the docs branch
        id: regen
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/docs/build.py
          open_pr="$(gh pr list --head "$DOCS_BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if git diff --quiet; then
            echo "Generated docs already up to date; no PR."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment "main already has these regions; closing the stale docs PR."
            fi
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$DOCS_BRANCH"
          git commit -am "$COMMIT_SUBJECT"
          git push --force origin "HEAD:refs/heads/$DOCS_BRANCH"
          if [ -z "$open_pr" ]; then
            gh pr create --base main --head "$DOCS_BRANCH" --title "Docs: regenerate fragment regions" \
              --body "Regenerated by the docs-regen workflow from main at ${GITHUB_SHA}. It merges itself once the normal PR CI gate passes (#738)."
            open_pr="$(gh pr list --head "$DOCS_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr=$open_pr" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Wait for normal PR CI
        if: steps.regen.outputs.changed == 'true'
        id: ci
        env:
          HEAD_SHA: ${{ steps.regen.outputs.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --branch "$DOCS_BRANCH" --event pull_request --commit "$HEAD_SHA" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "PR CI did not start on $DOCS_BRANCH at $HEAD_SHA." >&2
            exit 1
          fi
          gh run watch "$run_id" --interval 30 --exit-status
          # A successful run must actually include a passing gate, never just skipped jobs.
          gate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.name == "gate") | .conclusion] | join(",")')"
          if [ "$gate" != success ]; then
            echo "Required gate did not pass (conclusion: $gate)." >&2
            exit 1
          fi
      # The ruleset requires this check from a workflow CI does not wait on; it can still be queued.
      - name: Wait for the trusted gate guard
        if: steps.regen.outputs.changed == 'true'
        id: guard
        env:
          HEAD_SHA: ${{ steps.regen.outputs.sha }}
          GUARD_CHECK: gate-guard-target / gate-guard
        run: |
          set -euo pipefail
          state=""
          for attempt in $(seq 1 60); do
            # The newest run of the check wins: a superseded run of the same head is cancelled.
            state="$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              -f check_name="$GUARD_CHECK" -f per_page=100 \
              --jq '.check_runs | sort_by(.id) | last | select(. != null) | "\(.status) \(.conclusion // "")"')"
            case "$state" in
              "completed "*) break ;;
            esac
            sleep 30
          done
          if [ -z "$state" ]; then
            echo "Check '$GUARD_CHECK' never appeared on $HEAD_SHA." >&2
            exit 1
          fi
          if [ "${state%% *}" != completed ]; then
            echo "Check '$GUARD_CHECK' was still ${state%% *} on $HEAD_SHA after 30 minutes." >&2
            exit 1
          fi
          if [ "${state#* }" != success ]; then
            echo "Check '$GUARD_CHECK' did not pass on $HEAD_SHA (conclusion: ${state#* })." >&2
            exit 1
          fi
      # Installation tokens expire after one hour; mint a fresh one after the CI wait.
      - uses: actions/create-github-app-token@v3
        if: steps.regen.outputs.changed == 'true'
        id: merge-token
        with:
          app-id: ${{ secrets.DOCS_REGEN_APP_ID }}
          private-key: ${{ secrets.DOCS_REGEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Merge the docs PR
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.merge-token.outputs.token }}
          PR_NUMBER: ${{ steps.regen.outputs.pr }}
          HEAD_SHA: ${{ steps.regen.outputs.sha }}
        run: >
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$HEAD_SHA"
          --subject "$MERGE_SUBJECT (#$PR_NUMBER)"
