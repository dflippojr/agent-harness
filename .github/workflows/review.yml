name: Automated Code Review

# Trigger only on PR open (not every push) to keep this bounded to one pass
# per PR by default; use workflow_dispatch for an on-demand re-review after
# later commits. Runs on the self-hosted tower runner so it can reuse the
# already-authenticated Cursor Agent CLI login instead of an API key
# (no per-token billing). Claude Code is not used here; that subscription
# has been hitting the cap.
on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Cursor Agent login on the original tower runner. Do not share with pytest.
    runs-on: [self-hosted, Windows, X64, agent-harness-tower]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure GitHub CLI is on PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\GitHub CLI'

      - name: Resolve PR number
        id: pr
        shell: powershell
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          $num = $env:EVENT_PR_NUMBER
          if ([string]::IsNullOrEmpty($num)) { $num = $env:INPUT_PR_NUMBER }
          "number=$num" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run Cursor Agent review
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          $base = Join-Path $env:LOCALAPPDATA 'cursor-agent'
          $versions = Join-Path $base 'versions'
          $latest = Get-ChildItem -Path $versions -Directory -ErrorAction Stop |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $latest) { throw "no cursor-agent version under $versions" }
          $node = Join-Path $latest.FullName 'node.exe'
          $index = Join-Path $latest.FullName 'index.js'
          if (-not (Test-Path $node) -or -not (Test-Path $index)) {
            throw "cursor-agent node.exe/index.js missing in $($latest.FullName)"
          }

          $prompt = @"
Run 'gh pr diff $env:PR_NUMBER' to see this pull request's diff, then review it for correctness bugs only (not style or simplification). Report only high-confidence findings as a short Markdown list: file:line, the defect, and a concrete failure scenario that would trigger it. If you find nothing significant, reply with exactly one line saying so.

Do not edit files, commit, push, open a PR, or merge. Print only the review text; this job posts stdout as the PR comment.
"@

          # Same Windows invocation as agent-loop: call node.exe + index.js
          # directly so the prompt is not re-parsed through cursor-agent.cmd.
          & $node $index -p --output-format text --force --workspace $env:GITHUB_WORKSPACE $prompt |
            Out-File -FilePath review-output.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "cursor-agent exited $LASTEXITCODE"
          }
          if (-not (Test-Path review-output.md) -or (Get-Item review-output.md).Length -eq 0) {
            throw "cursor-agent produced no review output"
          }

      - name: Post review as PR comment
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment $env:PR_NUMBER --body-file review-output.md
