name: Automated Code Review

# One shared review workflow. This repository runs it directly (PR open, plus
# workflow_dispatch for an on-demand re-review after later commits); other
# projects call it through workflow_call from a thin dispatch-only caller pinned
# to the moving review-v1 tag (see "Adopting the review workflow" in
# docs/CI-CD.md). It runs on a self-hosted review runner so it can reuse the
# runner service user's already-authenticated Codex, Claude, and Cursor CLIs.
# The backend input can select one backend; auto uses the ordered
# REVIEW_BACKENDS repository variable, then codex,claude,cursor by default.
# The optional mode input is auto (incremental when a prior review marker
# makes that safe) or full. Pre-merge reviews should dispatch mode=full.
#
# Safety: the review agent reads untrusted PR content with shell access on the
# self-hosted runner. Consumers trigger it only by workflow_dispatch, never
# pull_request: a fork's pull_request run would execute the fork's own copy of
# the caller on the runner, while workflow_dispatch always runs the default
# branch's copy. The job refuses pull requests from forks either way, and the
# PR head checkout is review context only; the review tooling comes from this
# repository, never from the PR.
#
# Every run publishes an "Automated Code Review" Check Run on the PR head SHA
# whose conclusion follows the reviewer's REVIEW_VERDICT line: success when
# clean, failure with the finding count when it has findings, neutral for a
# partial (oversized-diff) clean review, and failure "Review did not complete"
# when the review machinery broke. The workflow run itself stays green when
# the review merely has findings.
on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      backend:
        description: "Review backend (auto uses REVIEW_BACKENDS)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - cursor
          - codex
          - claude
      mode:
        description: "Review coverage (auto = incremental when safe)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - full
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      backend:
        description: "Review backend: auto, cursor, codex, or claude"
        required: false
        default: auto
        type: string
      mode:
        description: "Review coverage: auto or full"
        required: false
        default: auto
        type: string
      runs_on:
        description: "JSON array of runner labels, e.g. [\"self-hosted\",\"Windows\",\"X64\",\"my-project-review\"]"
        required: true
        type: string
      max_diff_bytes:
        description: "Diff budget in bytes (empty uses the REVIEW_MAX_DIFF_BYTES variable, then 204800)"
        required: false
        default: ""
        type: string
      tooling_ref:
        description: "agent-harness ref that supplies ops/review/run-review.ps1; keep it equal to the ref in uses:"
        required: false
        default: review-v1
        type: string

permissions:
  pull-requests: write
  contents: read
  checks: write

jobs:
  review:
    # This repository's own runs use the pool of dedicated review runners
    # (D:\Agents\github-runner-review-1..3, one job each, same provider CLI logins)
    # so reviews of different PRs run in parallel. Add or remove pool members with
    # ops/github/install-runner.ps1 -Labels agent-harness-review. Callers pass
    # their own label through runs_on.
    runs-on: ${{ fromJSON(inputs.runs_on || '["self-hosted","Windows","X64","agent-harness-review"]') }}
    # Do not even schedule a fork's pull_request run on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Check out review tooling
        uses: actions/checkout@v4
        with:
          repository: dflippojr/agent-harness
          # This repository reviews with its own tooling at the triggering commit;
          # callers get the pinned tooling_ref (review-v1 by default).
          ref: ${{ github.repository == 'dflippojr/agent-harness' && github.sha || inputs.tooling_ref }}
          path: .review-tooling
          persist-credentials: false

      - name: Ensure GitHub CLI is on PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\GitHub CLI'

      - name: Resolve PR number
        id: pr
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          $num = $env:EVENT_PR_NUMBER
          if ([string]::IsNullOrEmpty($num)) { $num = $env:INPUT_PR_NUMBER }
          if ($num -notmatch '^\d+$') { throw "PR number must be numeric." }
          # Never check out or review a fork's pull request on this machine.
          $crossRepo = gh pr view $num --repo $env:GITHUB_REPOSITORY --json isCrossRepository --jq .isCrossRepository
          if ($LASTEXITCODE -ne 0 -or $crossRepo -ne 'false') { throw "Refusing to review PR #${num}: it is not a branch of this repository." }
          $workspace = Join-Path $env:GITHUB_WORKSPACE 'pr'
          "number=$num" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "workspace=$workspace" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Check out PR head for review context
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', steps.pr.outputs.number) }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Attach running check to the PR
        id: check
        continue-on-error: true
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          $sha = git -C pr rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sha)) { throw "no head SHA for PR $($env:PR_NUMBER)" }
          $details = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $started = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          # Do not ConvertTo-Json + pipe: Windows PowerShell emits nested hashtables as
          # Key/Value arrays and UTF-16 stdin, which the Check Runs API rejects (HTTP 400).
          $id = gh api --method POST "repos/$env:GITHUB_REPOSITORY/check-runs" `
            -f name="Automated Code Review" `
            -f head_sha="$sha" `
            -f status="in_progress" `
            -f started_at="$started" `
            -f details_url="$details" `
            -f "output[title]=Review in progress" `
            -f "output[summary]=Automated review is running for PR #$($env:PR_NUMBER)." `
            --jq .id
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($id) -or $id -notmatch '^\d+$') {
            throw "failed to create check run"
          }
          "id=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Check run $id on $sha ($details)"

      - name: Run automated review
        id: agent
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_WORKSPACE: ${{ steps.pr.outputs.workspace }}
          REQUESTED_BACKEND: ${{ inputs.backend }}
          REVIEW_MODE: ${{ inputs.mode }}
          REVIEW_BACKENDS: ${{ vars.REVIEW_BACKENDS }}
          REVIEW_MODEL_CLAUDE: ${{ vars.REVIEW_MODEL_CLAUDE }}
          REVIEW_MODEL_CURSOR: ${{ vars.REVIEW_MODEL_CURSOR }}
          REVIEW_MODEL_CODEX: ${{ vars.REVIEW_MODEL_CODEX }}
          REVIEW_EFFORT_CLAUDE: ${{ vars.REVIEW_EFFORT_CLAUDE }}
          REVIEW_EFFORT_CODEX: ${{ vars.REVIEW_EFFORT_CODEX }}
          REVIEW_MAX_DIFF_BYTES: ${{ inputs.max_diff_bytes || vars.REVIEW_MAX_DIFF_BYTES }}
          REVIEW_PROMPT: |
            Review the pull request diff embedded in this prompt for correctness bugs only (not style or simplification). Report only high-confidence findings as a short Markdown list: file:line, the defect, and a concrete failure scenario that would trigger it. If you find nothing significant, reply with exactly one line saying so.

            The embedded diff is authoritative for what changed. The workspace is the pull request head and is available only for surrounding code, history, and blame context.

            Do not edit files, commit, push, open a PR, or merge. Print only the review text; this job posts it as the PR comment. Only after you have actually inspected the embedded diff and reported findings or no significant findings, end with exactly two lines. First a verdict line: `REVIEW_VERDICT: CLEAN` if you reported no findings, or `REVIEW_VERDICT: FINDINGS <n>` where <n> is the number of findings you listed. Then a final line exactly `REVIEW_STATUS: COMPLETE`. Do not print either line if you could not inspect the diff.
        run: |
          & .\.review-tooling\ops\review\run-review.ps1 `
            -Backend $env:REQUESTED_BACKEND `
            -ConfiguredBackends $env:REVIEW_BACKENDS `
            -Mode $env:REVIEW_MODE `
            -Workspace $env:REVIEW_WORKSPACE `
            -Prompt $env:REVIEW_PROMPT `
            -OutputPath (Join-Path $env:GITHUB_WORKSPACE 'review-output.md') `
            -ScratchDirectory $env:RUNNER_TEMP

      - name: Post review as PR comment
        id: post
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment $env:PR_NUMBER --body-file review-output.md

      - name: Complete PR check
        if: always() && steps.check.outcome == 'success' && steps.check.outputs.id != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          AGENT_CONCLUSION: ${{ steps.agent.conclusion }}
          POST_CONCLUSION: ${{ steps.post.conclusion }}
          REVIEW_BACKEND: ${{ steps.agent.outputs.backend }}
          REVIEW_VERDICT: ${{ steps.agent.outputs.verdict }}
          REVIEW_FINDINGS: ${{ steps.agent.outputs.findings }}
          REVIEW_OMITTED_FILES: ${{ steps.agent.outputs.omitted_files }}
        run: |
          # Verdict -> conclusion. A red check means the code has findings or the
          # review did not complete; the run stays green for findings.
          $conclusion = 'failure'
          $title = 'Review did not complete'
          $summary = 'The automated review did not complete, so no verdict was posted. Open the workflow run for details.'
          $backend = $env:REVIEW_BACKEND
          if ([string]::IsNullOrWhiteSpace($backend)) { $backend = 'configured backends' }
          $omitted = 0
          [void][int]::TryParse([string]$env:REVIEW_OMITTED_FILES, [ref]$omitted)
          if ($env:AGENT_CONCLUSION -eq 'cancelled' -or $env:POST_CONCLUSION -eq 'cancelled') {
            $conclusion = 'cancelled'
            $title = 'Automated review cancelled'
            $summary = 'Automated review cancelled; no review was posted.'
          } elseif ($env:AGENT_CONCLUSION -eq 'success' -and $env:POST_CONCLUSION -eq 'success') {
            $count = 0
            $validCount = [int]::TryParse([string]$env:REVIEW_FINDINGS, [ref]$count)
            if ($env:REVIEW_VERDICT -eq 'findings' -and $validCount -and $count -gt 0) {
              $conclusion = 'failure'
              $title = $(if ($count -eq 1) { '1 finding' } else { "$count findings" })
              if ($omitted -gt 0) { $title = "$title (partial review: $omitted files not reviewed)" }
            } elseif ($env:REVIEW_VERDICT -eq 'clean' -and $omitted -gt 0) {
              $conclusion = 'neutral'
              $title = "Partial review: $omitted files not reviewed"
            } elseif ($env:REVIEW_VERDICT -eq 'clean') {
              $conclusion = 'success'
              $title = "Clean review by $backend"
            }
            if ($title -ne 'Review did not complete') {
              # The posted comment, readable from the Checks tab (API limit 65535 chars).
              $summary = Get-Content -Raw -Encoding utf8 -LiteralPath 'review-output.md'
              if ($summary.Length -gt 60000) { $summary = $summary.Substring(0, 60000) + "`n`n_(truncated; see the PR comment)_" }
            }
          }
          # Pass the summary through a file: a long review would exceed the command-line limit.
          $summaryPath = Join-Path $env:RUNNER_TEMP 'review-check-summary.md'
          [System.IO.File]::WriteAllText($summaryPath, $summary, (New-Object System.Text.UTF8Encoding($false)))
          $completed = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/check-runs/$env:CHECK_ID" `
            -f status="completed" `
            -f conclusion="$conclusion" `
            -f completed_at="$completed" `
            -f "output[title]=$title" `
            -F "output[summary]=@$summaryPath"
          if ($LASTEXITCODE -ne 0) { throw "failed to complete check run $($env:CHECK_ID)" }
          Write-Host "Check run $($env:CHECK_ID): $conclusion ($title)"
