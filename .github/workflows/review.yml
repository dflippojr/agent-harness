name: Automated Code Review

# Trigger only on PR open (not every push) to keep this bounded to one pass
# per PR by default; use workflow_dispatch for an on-demand re-review after
# later commits. Runs on the self-hosted review runner pool so it can reuse the
# already-authenticated Cursor Agent CLI login instead of an API key
# (no per-token billing). Claude Code is not used here; that subscription
# has been hitting the cap.
#
# pull_request runs already appear in the PR Checks tab. workflow_dispatch
# does not, so those re-reviews publish a Check Run on the PR head SHA.
on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  pull-requests: write
  contents: read
  checks: write

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Pool of dedicated review runners (D:\Agents\github-runner-review-1..3, one job
    # each, same Cursor Agent login) so reviews of different PRs run in parallel.
    # Kept off the tower runner (SonarQube) and the CI runner (pytest). Add or
    # remove pool members with ops/github/install-runner.ps1 -Labels agent-harness-review.
    runs-on: [self-hosted, Windows, X64, agent-harness-review]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure GitHub CLI is on PATH
        shell: powershell
        run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\GitHub CLI'

      - name: Resolve PR number
        id: pr
        shell: powershell
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          $num = $env:EVENT_PR_NUMBER
          if ([string]::IsNullOrEmpty($num)) { $num = $env:INPUT_PR_NUMBER }
          "number=$num" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach running check to the PR
        id: check
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          $sha = gh pr view $env:PR_NUMBER --json headRefOid --jq .headRefOid
          if ([string]::IsNullOrWhiteSpace($sha)) { throw "no head SHA for PR $($env:PR_NUMBER)" }
          $details = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $payload = @{
            name = "Automated Code Review"
            head_sha = $sha
            status = "in_progress"
            started_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            details_url = $details
            output = @{
              title = "Review in progress"
              summary = "Cursor Agent is reviewing PR #$($env:PR_NUMBER)."
            }
          }
          $json = $payload | ConvertTo-Json -Depth 6 -Compress
          $id = $json | gh api --method POST "repos/$env:GITHUB_REPOSITORY/check-runs" --input - --jq .id
          if ([string]::IsNullOrWhiteSpace($id)) { throw "failed to create check run" }
          "id=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Check run $id on $sha ($details)"

      - name: Run Cursor Agent review
        id: agent
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_PROMPT: |
            Run 'gh pr diff ${{ steps.pr.outputs.number }}' to see this pull request's diff, then review it for correctness bugs only (not style or simplification). Report only high-confidence findings as a short Markdown list: file:line, the defect, and a concrete failure scenario that would trigger it. If you find nothing significant, reply with exactly one line saying so.

            Do not edit files, commit, push, open a PR, or merge. Print only the review text; this job posts stdout as the PR comment.
        run: |
          $base = Join-Path $env:LOCALAPPDATA 'cursor-agent'
          $versions = Join-Path $base 'versions'
          $latest = Get-ChildItem -Path $versions -Directory -ErrorAction Stop |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $latest) { throw "no cursor-agent version under $versions" }
          $node = Join-Path $latest.FullName 'node.exe'
          $index = Join-Path $latest.FullName 'index.js'
          if (-not (Test-Path $node) -or -not (Test-Path $index)) {
            throw "cursor-agent node.exe/index.js missing in $($latest.FullName)"
          }

          # Same Windows invocation as agent-loop: call node.exe + index.js
          # directly so the prompt is not re-parsed through cursor-agent.cmd.
          & $node $index -p --output-format text --force --workspace $env:GITHUB_WORKSPACE $env:REVIEW_PROMPT |
            Out-File -FilePath review-output.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) {
            throw "cursor-agent exited $LASTEXITCODE"
          }
          if (-not (Test-Path review-output.md) -or (Get-Item review-output.md).Length -eq 0) {
            throw "cursor-agent produced no review output"
          }

      - name: Post review as PR comment
        id: post
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment $env:PR_NUMBER --body-file review-output.md

      - name: Complete PR check
        if: always() && github.event_name == 'workflow_dispatch' && steps.check.outputs.id != ''
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_ID: ${{ steps.check.outputs.id }}
          AGENT_CONCLUSION: ${{ steps.agent.conclusion }}
          POST_CONCLUSION: ${{ steps.post.conclusion }}
        run: |
          $conclusion = 'failure'
          if ($env:AGENT_CONCLUSION -eq 'success' -and $env:POST_CONCLUSION -eq 'success') {
            $conclusion = 'success'
          } elseif ($env:AGENT_CONCLUSION -eq 'cancelled' -or $env:POST_CONCLUSION -eq 'cancelled') {
            $conclusion = 'cancelled'
          }
          $summary = "Cursor Agent review $conclusion."
          $payload = @{
            status = "completed"
            conclusion = $conclusion
            completed_at = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            output = @{
              title = "Review $conclusion"
              summary = $summary
            }
          }
          $json = $payload | ConvertTo-Json -Depth 6 -Compress
          $json | gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/check-runs/$env:CHECK_ID" --input -
