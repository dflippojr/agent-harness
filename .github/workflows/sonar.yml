name: SonarCloud

# SonarCloud (free for this public repo) on GitHub-hosted Windows: the test
# suite is Windows-native (CreateProcess flags, msvcrt, PowerShell), so
# coverage has to be collected there. Real pull request analysis still stays
# off the tower and CI runners. Automatic analysis is turned off in
# SonarCloud; this workflow is the analysis. The job id stays `sonar` so the
# check keeps its name.
#
# Coverage is produced here (pytest-cov Cobertura XML) before the scanner
# runs. sonar.qualitygate.wait then fails the check when the SonarCloud
# quality gate fails, including coverage on new code (Sonar way: 80%).
#
# Coverage pytest uses pytest-xdist as a CI extra (not in requirements.txt)
# with a fixed -n 4 --dist loadfile. GitHub-hosted windows-latest has 4
# vCPUs; do not use pytest's auto worker count. The tower CI job uses -n 8
# on a larger machine;
# flags stay on this command (no repo-wide addopts) so the two jobs can
# differ. pytest-cov merges worker data into coverage.xml. COVERAGE_CORE
# sysmon is not set: .coveragerc enables branch coverage, and sysmon cannot
# measure branches on Python 3.12 (this job's version; branch sysmon needs
# 3.14+). The Confirm hosted runner cores step logs NUMBER_OF_PROCESSORS
# so soak logs can verify the 4-vCPU assumption.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: windows-latest
    # Secrets are not passed to pull requests from forks; skip rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov pytest-xdist

      - name: Confirm hosted runner cores
        shell: powershell
        run: Write-Host "NUMBER_OF_PROCESSORS=$env:NUMBER_OF_PROCESSORS"

      - name: Run tests with coverage
        # Hang diagnostics (intermittent hosted-runner stalls on #228): -v keeps the last finished test per worker in
        # the log, the watchdog dumps every python process's stacks if pytest is still running after 20 minutes,
        # and the step timeout turns a silent multi-hour hang into a failure.
        timeout-minutes: 40
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          python -m pip install --quiet py-spy
          @'
          Start-Sleep -Seconds 1200
          Write-Host '::warning::pytest still running after 20 minutes; stack dump follows'
          Get-Process python -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ('--- python pid ' + $_.Id); py-spy dump --pid $_.Id 2>&1 | Write-Host }
          '@ | Set-Content -Path $env:RUNNER_TEMP\hang-watchdog.ps1
          $watchdog = Start-Process -FilePath pwsh -ArgumentList '-NoProfile','-File',"$env:RUNNER_TEMP\hang-watchdog.ps1" -NoNewWindow -PassThru
          python -m pytest tests -v -n 4 --dist loadfile -o faulthandler_timeout=300 --cov=harness --cov=sdk --cov=scripts --cov=macrunner --cov-report=xml:coverage.xml --cov-report=term
          $code = $LASTEXITCODE
          Stop-Process -Id $watchdog.Id -Force -ErrorAction SilentlyContinue
          exit $code

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
