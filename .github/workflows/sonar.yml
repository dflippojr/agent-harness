name: SonarQube

# Tower-only scan. The self-hosted runner can reach SonarQube on localhost;
# GitHub-hosted runners must not. Community Build does not decorate PRs;
# this check is the public signal. Do not comment dashboard URLs on PRs.
# Same trigger as CI: skip feature-branch pushes until a PR exists.
#
# Community Build is last-writer-wins on a single projectKey, so a PR gets its
# own project: analyze the base SHA, analyze the PR head, then fail the GitHub
# check only when the head snapshot has unresolved issues or hotspots that the
# base snapshot did not (rule + path + message, counting duplicates). The
# scanner quality gate is not the verdict. The long-lived agent-harness project
# is updated from main for local/overall review and does not fail GitHub on
# existing issues.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    # localhost:9000. Keep this off the pytest runner.
    runs-on: [self-hosted, Windows, X64, agent-harness-tower]
    continue-on-error: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            Write-Host 'SONAR_TOKEN is not set; skipping scan.'
            exit 0
          }
          $hostUrl = $env:SONAR_HOST_URL
          if ([string]::IsNullOrWhiteSpace($hostUrl)) {
            $hostUrl = 'http://host.docker.internal:9000'
          }
          $apiUrl = $hostUrl -replace 'host.docker.internal', '127.0.0.1'

          function Invoke-Sonar([string]$projectKey, [string]$projectName, [string]$version) {
            docker run --rm `
              -e "SONAR_HOST_URL=$hostUrl" `
              -e "SONAR_TOKEN=$env:SONAR_TOKEN" `
              -v "${PWD}:/usr/src" `
              sonarsource/sonar-scanner-cli:11 `
              "-Dsonar.projectKey=$projectKey" `
              "-Dsonar.projectName=$projectName" `
              "-Dsonar.projectVersion=$version" `
              "-Dsonar.qualitygate.wait=false"
            $code = $LASTEXITCODE
            Write-Host "scanner exit $code (project=$projectKey version=$version)"
            if ($code -ne 0) {
              throw "SonarQube scan failed with exit $code"
            }
          }

          if ($env:EVENT_NAME -eq 'pull_request') {
            if ([string]::IsNullOrWhiteSpace($env:BASE_SHA) -or [string]::IsNullOrWhiteSpace($env:PR_NUMBER)) {
              throw 'pull_request scan needs BASE_SHA and PR_NUMBER'
            }
            $key = "agent-harness-pr-$($env:PR_NUMBER)"
            $name = "agent-harness PR $($env:PR_NUMBER)"
            $baseVer = "base-$($env:BASE_SHA.Substring(0, 8))"
            $prVer = "pr-$($env:HEAD_SHA.Substring(0, 8))"
            $tmp = $env:RUNNER_TEMP
            if ([string]::IsNullOrWhiteSpace($tmp)) { $tmp = $env:TEMP }
            $gateScript = Join-Path $tmp 'sonar_pr_gate.py'
            $baseSnap = Join-Path $tmp 'sonar-base.json'
            $headSnap = Join-Path $tmp 'sonar-head.json'
            Copy-Item -Force (Join-Path $PWD 'scripts\sonar_pr_gate.py') $gateScript

            function Invoke-Gate([string[]]$GateArgs) {
              & python -u $gateScript @GateArgs
              if ($LASTEXITCODE -ne 0) {
                throw "sonar_pr_gate.py failed with exit $LASTEXITCODE"
              }
            }

            Write-Host "Baseline scan of $($env:BASE_SHA) into $key"
            git checkout --force --detach $env:BASE_SHA
            if ($LASTEXITCODE -ne 0) { throw "git checkout base $($env:BASE_SHA) failed" }
            $afterId = & python -u $gateScript latest-id --host $apiUrl --project $key
            if ($LASTEXITCODE -ne 0) { throw "sonar_pr_gate.py latest-id failed with exit $LASTEXITCODE" }
            Invoke-Sonar $key $name $baseVer
            Invoke-Gate @('collect', '--host', $apiUrl, '--project', $key, ('--after-id=' + "$afterId".Trim()), '--out', $baseSnap)

            Write-Host "PR scan of $($env:HEAD_SHA) into $key"
            git checkout --force --detach $env:HEAD_SHA
            if ($LASTEXITCODE -ne 0) { throw "git checkout head $($env:HEAD_SHA) failed" }
            $afterId = & python -u $gateScript latest-id --host $apiUrl --project $key
            if ($LASTEXITCODE -ne 0) { throw "sonar_pr_gate.py latest-id failed with exit $LASTEXITCODE" }
            Invoke-Sonar $key $name $prVer
            Invoke-Gate @('collect', '--host', $apiUrl, '--project', $key, ('--after-id=' + "$afterId".Trim()), '--out', $headSnap)
            Invoke-Gate @('diff', '--baseline', $baseSnap, '--head', $headSnap)
          } else {
            docker run --rm `
              -e "SONAR_HOST_URL=$hostUrl" `
              -e "SONAR_TOKEN=$env:SONAR_TOKEN" `
              -v "${PWD}:/usr/src" `
              sonarsource/sonar-scanner-cli:11 `
              "-Dsonar.projectKey=agent-harness" `
              "-Dsonar.qualitygate.wait=false"
            if ($LASTEXITCODE -ne 0) {
              throw "SonarQube scan failed with exit $LASTEXITCODE"
            }
          }
