name: SonarCloud

# SonarCloud (free for this public repo) on GitHub-hosted runners: real pull
# request analysis, so the quality gate judges only what a PR changes against
# its base, and nothing queues on the tower runner. Automatic analysis is
# turned off in SonarCloud; this workflow is the analysis. The job id stays
# `sonar` so the check keeps its name.
#
# Coverage is produced here (pytest-cov Cobertura XML) before the scanner
# runs. sonar.qualitygate.wait then fails the check when the SonarCloud
# quality gate fails, including coverage on new code (Sonar way: 80%).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-latest
    # Secrets are not passed to pull requests from forks; skip rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        run: >
          python -m pytest tests -q
          --cov=harness --cov=sdk --cov=scripts --cov=macrunner
          --cov-report=xml:coverage.xml --cov-report=term

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
