name: SonarCloud

# SonarCloud (free for this public repo) on GitHub-hosted Windows: the test
# suite is Windows-native (CreateProcess flags, msvcrt, PowerShell), so
# coverage has to be collected there. Real pull request analysis still stays
# off the tower and CI runners. Automatic analysis is turned off in
# SonarCloud; this workflow is the analysis. The job id stays `sonar` so the
# check keeps its name.
#
# Coverage is produced here (pytest-cov Cobertura XML) before the scanner
# runs. sonar.qualitygate.wait then fails the check when the SonarCloud
# quality gate fails, including coverage on new code (Sonar way: 80%).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: windows-latest
    # Secrets are not passed to pull requests from forks; skip rather than fail.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov

      - name: Run tests with coverage
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: >
          python -m pytest tests -q
          --cov=harness --cov=sdk --cov=scripts --cov=macrunner
          --cov-report=xml:coverage.xml --cov-report=term

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
