name: Staging smoke slot

# One disposable Agent Harness Server slot on the tower (issue #129). Trusted-code only: branches of this
# repository and pull requests whose head repository is this repository. Manual dispatch only; a new run replaces
# whatever is in the slot. Nothing here touches the production checkout, task, data, tags, GPU, or the :443 route.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch in this repository to deploy (leave empty when using pr_number)
        required: false
        default: ""
      pr_number:
        description: Pull request number whose head repository is this repository
        required: false
        default: ""
      reset:
        description: Reset the slot (stop staging and delete staging data) without deploying
        type: boolean
        required: false
        default: false

# Deliberately its own group: production (`agent-harness-main-deployment`) must never queue behind staging.
concurrency:
  group: agent-harness-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve
    # GitHub-hosted, so an invalid or fork ref fails closed before the staging runner sees candidate code.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      ref_label: ${{ steps.resolve.outputs.ref_label }}
      reset_only: ${{ steps.resolve.outputs.reset_only }}
    steps:
      - name: Require the trusted control plane
        # The control plane is always this workflow file on the default branch; a candidate copy must not deploy.
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "staging dispatch rejected: dispatch this workflow from main, not $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Validate the ref and resolve an immutable commit
        id: resolve
        run: >-
          python scripts/resolve_staging_ref.py
          --branch "$INPUT_BRANCH"
          --pr-number "$INPUT_PR_NUMBER"
          --reset "$INPUT_RESET"
          --repository "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_RESET: ${{ inputs.reset }}

  stage:
    name: stage
    needs: resolve
    # Never agent-harness-tower (production-privileged) and never agent-harness-ci.
    runs-on: [self-hosted, Windows, X64, agent-harness-staging]
    timeout-minutes: 30
    environment: tower-staging
    permissions:
      contents: read
    steps:
      - name: Check out the trusted deployer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Reset the staging slot
        if: needs.resolve.outputs.reset_only == 'true'
        shell: powershell
        run: .\ops\harness\deploy-staging.ps1 -Reset
      - name: Deploy the resolved commit to the staging slot
        if: needs.resolve.outputs.reset_only != 'true'
        shell: powershell
        run: .\ops\harness\deploy-staging.ps1 -Commit $env:STAGING_COMMIT
        env:
          STAGING_COMMIT: ${{ needs.resolve.outputs.sha }}
      - name: Report the staging slot
        shell: powershell
        run: >-
          .\ops\harness\report-staging.ps1
          -RefLabel $env:STAGING_REF_LABEL
          -Commit $env:STAGING_COMMIT
        env:
          STAGING_REF_LABEL: ${{ needs.resolve.outputs.ref_label }}
          STAGING_COMMIT: ${{ needs.resolve.outputs.sha }}
